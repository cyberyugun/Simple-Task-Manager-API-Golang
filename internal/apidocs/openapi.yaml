openapi: 3.1.0
info:
  title: Simple Task Manager API
  version: 1.4.0
  description: |
    REST API for user authentication and per-user task management.
    Protected task endpoints require a Bearer JWT access token.
    This document is the governed public compatibility contract for API v1.
x-api-version: v1
x-stability: stable
x-runtime-version-header: X-API-Version
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: System
  - name: Authentication
  - name: Tasks
  - name: Workspaces

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
  /ready:
    get:
      tags: [System]
      summary: Dependency readiness check
      operationId: readinessCheck
      responses:
        '200':
          description: API dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '503':
          description: A configured dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics
      operationId: metrics
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
  /version:
    get:
      tags: [System]
      summary: Build and runtime version information
      operationId: version
      responses:
        '200':
          description: Build metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionEnvelope'
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate a refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Access and refresh tokens rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke a refresh token
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Refresh token revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset instructions
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Generic password reset response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTokenEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password with a one-time token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change the current user's password
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed and refresh sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/logout-all:
    post:
      tags: [Authentication]
      summary: Revoke all refresh sessions for the current user
      operationId: logoutAll
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All refresh sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/sessions:
    get:
      tags: [Authentication]
      summary: List active refresh sessions
      operationId: listSessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active sessions ordered by last use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/sessions/{id}:
    delete:
      tags: [Authentication]
      summary: Revoke one refresh session
      operationId: revokeSession
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/auth/email-verification/request:
    post:
      tags: [Authentication]
      summary: Request an email verification token
      operationId: requestEmailVerification
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verification instructions created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTokenEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/email-verification/confirm:
    post:
      tags: [Authentication]
      summary: Verify email with a one-time token
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/workspaces:
    get:
      tags: [Workspaces]
      summary: List workspaces visible to the current user
      operationId: listWorkspaces
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workspace memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAccessListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Workspaces]
      summary: Create a shared workspace
      operationId: createWorkspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created with current user as owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/workspaces/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    get:
      tags: [Workspaces]
      summary: Get current user's workspace access
      operationId: getWorkspace
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workspace access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
    put:
      tags: [Workspaces]
      summary: Rename a workspace
      operationId: renameWorkspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameWorkspaceRequest'
      responses:
        '200':
          description: Workspace renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
    delete:
      tags: [Workspaces]
      summary: Delete a non-personal workspace
      operationId: deleteWorkspace
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workspace deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
  /api/workspaces/{id}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    get:
      tags: [Workspaces]
      summary: List workspace members
      operationId: listWorkspaceMembers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workspace members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
    post:
      tags: [Workspaces]
      summary: Add a workspace member
      operationId: addWorkspaceMember
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWorkspaceMemberRequest'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          description: User is already a workspace member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/workspaces/{id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/UserID'
    put:
      tags: [Workspaces]
      summary: Change a workspace member role
      operationId: updateWorkspaceMemberRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceMemberRequest'
      responses:
        '200':
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
    delete:
      tags: [Workspaces]
      summary: Remove a workspace member
      operationId: removeWorkspaceMember
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Membership removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
  /api/workspaces/{id}/audit:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    get:
      tags: [Workspaces]
      summary: List workspace security audit events
      operationId: listWorkspaceAudit
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Recent audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'

  /api/tasks:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
    get:
      tags: [Tasks]
      summary: List current user's tasks
      operationId: listTasks
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - in: query
          name: search
          schema:
            type: string
          description: Case-insensitive search in title and description.
        - in: query
          name: completed
          schema:
            type: boolean
        - in: query
          name: sort
          schema:
            type: string
            enum: [id, title, created_at, updated_at, completed]
            default: created_at
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tasks]
      summary: Create a task
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskWriteRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskID'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
    get:
      tags: [Tasks]
      summary: Get a task
      operationId: getTask
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Tasks]
      summary: Update a task
      operationId: updateTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskWriteRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Tasks]
      summary: Delete a task
      operationId: deleteTask
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tasks/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
    patch:
      tags: [Tasks]
      summary: Mark a task completed
      operationId: completeTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskID'
      responses:
        '200':
          description: Task completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WorkspaceID:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    UserID:
      in: path
      name: user_id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    WorkspaceIDHeader:
      in: header
      name: X-Workspace-ID
      required: false
      description: Select a workspace membership. Omit to use the user's personal workspace.
      schema:
        type: integer
        format: int64
        minimum: 1
    TaskID:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Task not found for the current user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated user does not have permission for the workspace action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    WorkspaceNotFound:
      description: Workspace is missing or not visible to the authenticated user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Authentication rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          example: Yudi
        email:
          type: string
          format: email
          example: yudi@example.com
        password:
          type: string
          minLength: 8
          format: password
          example: password123
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: yudi@example.com
        password:
          type: string
          format: password
          example: password123
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          example: qJqO4DBpO9dOJKmSZ9Xn0dD7eLw_LiFrZGmCwM0fS6o
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 8
          format: password
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          minLength: 8
          format: password
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    ActionTokenResult:
      type: object
      required: [message]
      properties:
        message:
          type: string
        development_token:
          type: string
          description: Present only when EXPOSE_AUTH_TOKENS=true for local/testing.
    RefreshSession:
      type: object
      required: [id, expires_at, last_used_at, created_at]
      properties:
        id:
          type: integer
          format: int64
        user_agent:
          type: string
        ip_address:
          type: string
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    User:
      type: object
      required: [id, name, email, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        email_verified_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuthResult:
      type: object
      required: [user, access_token, refresh_token, token_type, access_token_expires_in, refresh_token_expires_in]
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token:
          type: string
        refresh_token:
          type: string
          description: Opaque refresh token. It is rotated on every successful refresh.
        token_type:
          type: string
          const: Bearer
        access_token_expires_in:
          type: integer
          format: int64
          description: Access token lifetime in seconds.
          example: 900
        refresh_token_expires_in:
          type: integer
          format: int64
          description: Refresh token lifetime in seconds.
          example: 2592000
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: Platform Team
    RenameWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    AddWorkspaceMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
