        - { in: path, name: depends_on_id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Dependency removed }
  /api/tasks/{id}/recurrence:
    get:
      tags: [Task Collaboration]
      summary: Get task recurrence configuration
      operationId: getTaskRecurrence
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Recurrence rule }
    put:
      tags: [Task Collaboration]
      summary: Configure task recurrence
      operationId: setTaskRecurrence
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Recurrence configured }
    delete:
      tags: [Task Collaboration]
      summary: Remove task recurrence
      operationId: deleteTaskRecurrence
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Recurrence removed }
  /api/tasks/{id}/activity:
    get:
      tags: [Task Collaboration]
      summary: Get the task activity timeline
      operationId: listTaskActivity
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Activity timeline }
  /api/tasks/{id}/custom-fields:
    get:
      tags: [Task Collaboration]
      summary: List custom field values for a task
      operationId: listTaskCustomFieldValues
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Custom field values }
  /api/tasks/{id}/custom-fields/{field_id}:
    put:
      tags: [Task Collaboration]
      summary: Set a task custom field value
      operationId: setTaskCustomFieldValue
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
        - { in: path, name: field_id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Custom field value updated }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WorkspaceID:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    UserID:
      in: path
      name: user_id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    WorkspaceIDHeader:
      in: header
      name: X-Workspace-ID
      required: false
      description: Select a workspace membership. Omit to use the user's personal workspace.
      schema:
        type: integer
        format: int64
        minimum: 1
    WebhookSubscriptionID:
      in: path
      name: subscription_id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKey:
      in: header
      name: X-Idempotency-Key
      required: false
      description: Dedupe key scoped to the resolved workspace. Reusing the same key with a different request returns 409.
      schema:
        type: string
        maxLength: 200
    TaskID:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Task not found for the current user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated user does not have permission for the workspace action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    WorkspaceNotFound:
      description: Workspace is missing or not visible to the authenticated user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Authentication rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          example: Yudi
        email:
          type: string
          format: email
          example: yudi@example.com
        password:
          type: string
          minLength: 8
          format: password
          example: password123
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: yudi@example.com
        password:
          type: string
          format: password
          example: password123
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          example: qJqO4DBpO9dOJKmSZ9Xn0dD7eLw_LiFrZGmCwM0fS6o
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 8
          format: password
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          minLength: 8
          format: password
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    ActionTokenResult:
      type: object
      required: [message]
      properties:
        message:
          type: string
        development_token:
          type: string
          description: Present only when EXPOSE_AUTH_TOKENS=true for local/testing.
    RefreshSession:
      type: object
      required: [id, expires_at, last_used_at, created_at]
      properties:
        id:
          type: integer
          format: int64
        user_agent:
          type: string
        ip_address:
          type: string
        mfa_authenticated:
          type: boolean
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    User:
      type: object
      required: [id, name, email, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        email_verified_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuthResult:
      type: object
      required: [user, access_token, refresh_token, token_type, access_token_expires_in, refresh_token_expires_in]
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token:
          type: string
        refresh_token:
          type: string
          description: Opaque refresh token. It is rotated on every successful refresh.
        token_type:
          type: string
          const: Bearer
        access_token_expires_in:
          type: integer
          format: int64
          description: Access token lifetime in seconds.
          example: 900
        refresh_token_expires_in:
          type: integer
          format: int64
          description: Refresh token lifetime in seconds.
          example: 2592000
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: Platform Team
    RenameWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    AddWorkspaceMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member]
    UpdateWorkspaceMemberRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
    Workspace:
      type: object
      required: [id, name, created_by_user_id, is_personal, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created_by_user_id:
          type: integer
          format: int64
        is_personal:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkspaceAccess:
      allOf:
        - $ref: '#/components/schemas/Workspace'
        - type: object
          required: [role]
          properties:
            role:
              type: string
              enum: [owner, admin, member]
    WorkspaceMember:
      type: object
      required: [workspace_id, user_id, role, created_at, updated_at]
      properties:
        workspace_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, admin, member]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuditEvent:
      type: object
      required: [id, action, resource_type, created_at]
      properties:
        id:
          type: integer
          format: int64
        workspace_id:
          type: integer
          format: int64
        actor_user_id:
          type: integer
          format: int64
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    WorkspaceEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Workspace'
    WorkspaceAccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/WorkspaceAccess'
    WorkspaceAccessListEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceAccess'
    WorkspaceMemberEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/WorkspaceMember'
    WorkspaceMemberListEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceMember'
    AuditEventListEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
    CreateWebhookSubscriptionRequest:
      type: object
      required: [url, event_types]
      properties:
        url:
          type: string
          format: uri
          description: HTTPS delivery endpoint. Plain HTTP is disabled by default.
        event_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: ['*', task.created, task.updated, task.deleted]
    WebhookSubscription:
      type: object
      required: [id, workspace_id, url, event_types, active, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        workspace_id:
          type: integer
          format: int64
        created_by_user_id:
          type: integer
          format: int64
        url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
        active:
          type: boolean
        signing_secret:
          type: string
          description: Returned only when the subscription is created.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookSubscriptionEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/WebhookSubscription'
    WebhookSubscriptionListEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSubscription'
    TaskWriteRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          example: Learn Golang
        description:
          type: string
          example: Build REST API
    Task:
      type: object
      required: [id, title, description, completed, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        workspace_id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
        description:
          type: string
        completed:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Pagination:
      type: object
      required: [page, limit, total, total_pages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer
    TaskPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        pagination:
          $ref: '#/components/schemas/Pagination'
    BuildInfo:
      type: object
      required: [version, commit, build_time, go_version]
      properties:
        version:
          type: string
          example: v1.2.0
        commit:
          type: string
          example: 937f4928c6154446e80ded956718eeda69d3e105
        build_time:
          type: string
          example: 2026-10-03T00:00:00Z
        go_version:
          type: string
          example: go1.23.0
    HealthEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
          example: API is healthy
    MessageEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
    ErrorEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
    VersionEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/BuildInfo'
    AuthEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/AuthResult'
    ActionTokenEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ActionTokenResult'
    SessionListEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/RefreshSession'
    TaskEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Task'
    TaskPageEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/TaskPage'
