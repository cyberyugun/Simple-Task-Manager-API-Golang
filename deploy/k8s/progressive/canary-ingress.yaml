apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-api-canary
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-api-canary
    app.kubernetes.io/part-of: simple-task-manager
    app.kubernetes.io/track: canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"
    nginx.ingress.kubernetes.io/canary-by-header-value: "always"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - task-api.example.com
      secretName: task-api-tls
  rules:
    - host: task-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-api-canary
                port:
                  name: http
