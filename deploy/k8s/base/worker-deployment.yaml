apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-worker
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: simple-task-manager
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: task-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: simple-task-manager
    spec:
      serviceAccountName: task-api
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: task-api:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/worker"]
          envFrom:
            - configMapRef:
                name: task-api-config
            - secretRef:
                name: task-api-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
