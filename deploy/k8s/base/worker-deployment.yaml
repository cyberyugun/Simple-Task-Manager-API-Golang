apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-worker
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: simple-task-manager
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: task-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: simple-task-manager
    spec:
      serviceAccountName: task-api
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: task-worker
      containers:
        - name: worker
          image: task-api:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/worker"]
          envFrom:
            - configMapRef:
                name: task-api-config
            - secretRef:
                name: task-api-secrets
          env:
            - name: WORKER_BATCH_SIZE
              value: "25"
            - name: WORKER_POLL_INTERVAL
              value: "1s"
            - name: WEBHOOK_REQUEST_TIMEOUT
              value: "10s"
            - name: WEBHOOK_MAX_ATTEMPTS
              value: "8"
            - name: WEBHOOK_BASE_BACKOFF
              value: "1s"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
