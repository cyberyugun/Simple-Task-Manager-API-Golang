apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-worker
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: simple-task-manager
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: task-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: simple-task-manager
    spec:
      serviceAccountName: task-api
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: task-api:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/worker"]
          ports:
            - name: metrics
              containerPort: 9091
              protocol: TCP
          envFrom:
            - configMapRef:
                name: task-api-config
            - secretRef:
                name: task-api-secrets
          env:
            - name: WORKER_METRICS_ADDR
              value: ":9091"
            - name: WEBHOOK_ALLOW_PRIVATE_NETWORKS
              value: "false"
          startupProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
