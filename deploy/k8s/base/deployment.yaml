apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: simple-task-manager
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: task-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: simple-task-manager
    spec:
      serviceAccountName: task-api
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: task-api
      containers:
        - name: api
          image: task-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: task-api-config
            - secretRef:
                name: task-api-secrets
          env:
            - name: ACCESS_TOKEN_TTL
              value: "15m"
            - name: REFRESH_TOKEN_TTL
              value: "720h"
            - name: PASSWORD_RESET_TTL
              value: "30m"
            - name: EXPOSE_AUTH_TOKENS
              value: "false"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
