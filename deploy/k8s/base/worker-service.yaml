apiVersion: v1
kind: Service
metadata:
  name: task-worker-metrics
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: simple-task-manager
spec:
  selector:
    app.kubernetes.io/name: task-worker
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
      protocol: TCP
