apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-api-ingress
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: task-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
