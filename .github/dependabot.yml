version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5

  - package-ecosystem: terraform
    directory: /infra/terraform/aws
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3

  - package-ecosystem: terraform
    directory: /infra/terraform/azure
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3

  - package-ecosystem: terraform
    directory: /infra/terraform/gcp
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3

  - package-ecosystem: terraform
    directory: /infra/terraform/platform
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3

  - package-ecosystem: terraform
    directory: /infra/terraform/bootstrap/aws
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 2

  - package-ecosystem: terraform
    directory: /infra/terraform/bootstrap/azure
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 2

  - package-ecosystem: terraform
    directory: /infra/terraform/bootstrap/gcp
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 2
