name: Phase 40 Gofmt

on:
  push:
    branches:
      - phase-40-developer-platform-public-api

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-40-developer-platform-public-api
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Format
        run: gofmt -w cmd/api/main.go internal/apidocs/docs.go internal/auth/token.go internal/handler/developer_platform_handler.go internal/middleware/developer_platform.go internal/model/developer_platform.go internal/repository/developer_platform_repository.go internal/repository/postgres_developer_platform_repository.go internal/repository/developer_platform_postgres_integration_test.go internal/repository/postgres_integration_test.go internal/service/developer_platform_service.go internal/service/developer_platform_service_test.go internal/service/enterprise_identity_service.go generated/sdk/go/client.go
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(phase-40): gofmt developer platform"
          git push origin HEAD:phase-40-developer-platform-public-api
