name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -diff -recursive infra/terraform

  validate:
    name: Validate ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: fmt

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AWS
            directory: infra/terraform/aws
          - name: Azure
            directory: infra/terraform/azure
          - name: GCP
            directory: infra/terraform/gcp
          - name: Platform
            directory: infra/terraform/platform
          - name: Bootstrap AWS
            directory: infra/terraform/bootstrap/aws
          - name: Bootstrap Azure
            directory: infra/terraform/bootstrap/azure
          - name: Bootstrap GCP
            directory: infra/terraform/bootstrap/gcp

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Initialize providers
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        working-directory: ${{ matrix.directory }}
        run: terraform validate -no-color
