name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate operational scripts
        run: |
          bash -n scripts/production-preflight.sh
          bash -n scripts/postgres-backup-restore-check.sh
          bash -n scripts/dr-readiness-check.sh
          bash -n scripts/resilience-smoke.sh
          bash -n scripts/performance-policy-check.sh
          bash -n scripts/progressive-deploy.sh
          bash -n scripts/release-policy-check.sh
          bash -n scripts/rollback-drill.sh
          bash -n scripts/staging-preflight.sh
          python3 -m py_compile scripts/check-migration-compatibility.py
          python3 -m py_compile scripts/promotion-evidence.py
          ruby -c scripts/openapi-governance.rb
          ruby -c scripts/openapi-compatibility.rb
          ruby -c scripts/consumer-contract.rb
          ruby -c scripts/generate-typescript-sdk.rb
          ruby -c scripts/openapi-live-contract.rb
          ruby scripts/openapi-governance.rb
          ruby scripts/consumer-contract.rb
          bash scripts/dr-readiness-check.sh
          bash scripts/performance-policy-check.sh
          bash scripts/release-policy-check.sh

      - name: Test release safety gates
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          printf '%s\n' 'DROP TABLE tasks;' > "$tmpdir/999_destructive.sql"
          if python3 scripts/check-migration-compatibility.py "$tmpdir"; then
            echo "destructive migration unexpectedly passed compatibility gate"
            exit 1
          fi

          if CANARY_WEIGHT=75 bash scripts/release-policy-check.sh; then
            echo "invalid canary weight unexpectedly passed release policy"
            exit 1
          fi

          python3 scripts/promotion-evidence.py create             --output /tmp/promotion-evidence.json             --commit test-commit             --image-digest sha256:test             --run-id 123             --source-ref refs/tags/v-test             --staging-url https://staging.example.com
          python3 scripts/promotion-evidence.py verify             --file /tmp/promotion-evidence.json             --commit test-commit             --image-digest sha256:test             --run-id 123
          if python3 scripts/promotion-evidence.py verify             --file /tmp/promotion-evidence.json             --commit wrong-commit             --image-digest sha256:test             --run-id 123; then
            echo "mismatched promotion evidence unexpectedly passed"
            exit 1
          fi

      - name: Validate Terraform delivery helpers
        run: |
          bash -n scripts/terraform-prepare.sh
          python3 -m py_compile scripts/terraform-plan-metadata.py scripts/terraform-verify-plan.py

      - name: Enforce immutable GitHub Action pins
        run: |
          ruby <<'RUBY'
          Dir[".github/workflows/*.{yml,yaml}"].sort.each do |path|
            File.readlines(path).each_with_index do |line, index|
              next unless line =~ /^\s*uses:\s*([^\s#]+)/
              reference = Regexp.last_match(1)
              next if reference.start_with?("./")

              action, ref = reference.split("@", 2)
              unless action && ref && ref.match?(/\A[0-9a-f]{40}\z/)
                raise "#{path}:#{index + 1}: action must be pinned to a 40-character commit SHA: #{reference}"
              end
            end
          end
          RUBY

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Prepare modules
        run: go mod tidy

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./cmd/...

  integration:
    name: PostgreSQL Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: task_user
          POSTGRES_PASSWORD: task_password
          POSTGRES_DB: task_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_user -d task_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Prepare modules
        run: go mod tidy

      - name: Run migrations twice
        env:
          DATABASE_URL: postgres://task_user:task_password@localhost:5432/task_manager_test?sslmode=disable
          MIGRATIONS_DIR: migrations
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate

      - name: PostgreSQL repository integration tests
        env:
          TEST_DATABASE_URL: postgres://task_user:task_password@localhost:5432/task_manager_test?sslmode=disable
        run: go test -tags=integration -race ./internal/repository -run Integration -v

  manifests:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: Render production manifests
        run: |
          kubectl kustomize deploy/k8s/overlays/production > /tmp/kubernetes.yaml
          kubectl kustomize deploy/k8s/overlays/staging > /tmp/staging-kubernetes.yaml
          test -s /tmp/kubernetes.yaml
          test -s /tmp/staging-kubernetes.yaml
          grep -q '^kind: Deployment$' /tmp/kubernetes.yaml
          grep -q 'name: task-worker' /tmp/kubernetes.yaml
          grep -q '^kind: Service$' /tmp/kubernetes.yaml
          grep -q '^kind: HorizontalPodAutoscaler$' /tmp/kubernetes.yaml
          grep -q '^kind: PodDisruptionBudget$' /tmp/kubernetes.yaml
          grep -q '^kind: NetworkPolicy$' /tmp/kubernetes.yaml
          grep -q '^kind: Ingress$' /tmp/kubernetes.yaml
          grep -q '^kind: ClusterIssuer$' /tmp/kubernetes.yaml
          grep -q '^kind: ServiceMonitor$' /tmp/kubernetes.yaml
          grep -q '^kind: PrometheusRule$' /tmp/kubernetes.yaml
          grep -q 'namespace: task-manager-staging' /tmp/staging-kubernetes.yaml
          grep -q 'APP_ENV: staging' /tmp/staging-kubernetes.yaml
          grep -q 'name: task-api-staging' /tmp/staging-kubernetes.yaml
          grep -q 'staging-task-api.example.com' /tmp/staging-kubernetes.yaml

      - name: Validate manifest YAML structure
        run: |
          ruby <<'RUBY'
          require "yaml"

          paths = [
            "/tmp/kubernetes.yaml",
            "deploy/k8s/base/migration-job.yaml",
            "deploy/k8s/base/worker-deployment.yaml",
            "deploy/k8s/base/secret.example.yaml",
            "deploy/k8s/optional/external-secret.example.yaml",
            "deploy/k8s/optional/cert-manager-clusterissuer.example.yaml",
            "deploy/k8s/progressive/canary-deployment.yaml",
            "deploy/k8s/progressive/canary-service.yaml",
            "deploy/k8s/progressive/canary-ingress.yaml",
            "deploy/k8s/overlays/staging/namespace.yaml",
            "deploy/k8s/overlays/staging/namespace-delete.yaml",
            "deploy/k8s/overlays/staging/configmap.yaml",
            "deploy/k8s/overlays/staging/ingress.yaml",
            "deploy/k8s/overlays/staging/deployment-patch.yaml",
            "deploy/k8s/overlays/staging/hpa-patch.yaml",
            "deploy/k8s/overlays/staging/servicemonitor.yaml"
          ]

          paths.each do |path|
            documents = YAML.load_stream(File.read(path)).compact
            raise "#{path}: no YAML documents" if documents.empty?

            documents.each_with_index do |document, index|
              raise "#{path}: document #{index + 1} is not a mapping" unless document.is_a?(Hash)
              raise "#{path}: document #{index + 1} missing apiVersion" if document["apiVersion"].to_s.empty?
              raise "#{path}: document #{index + 1} missing kind" if document["kind"].to_s.empty?
              metadata = document["metadata"]
              raise "#{path}: document #{index + 1} missing metadata.name" unless metadata.is_a?(Hash) && !metadata["name"].to_s.empty?
            end

            puts "#{path}: #{documents.length} document(s) valid"
          end
          RUBY

  container:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, integration, manifests]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start stack
        env:
          JWT_SECRET: ci-local-secret-123456789012345678901234
          EXPOSE_AUTH_TOKENS: "true"
          AUTH_RATE_LIMIT_REQUESTS: "100"
          WEBHOOK_ALLOW_INSECURE_HTTP: "true"
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Smoke test system endpoints
        run: |
          curl --fail --silent http://localhost:8080/health | grep "API is healthy"
          curl --fail --silent http://localhost:8080/ready | grep "API is ready"
          curl --fail --silent http://localhost:8080/openapi.yaml | grep "openapi: 3.1.0"
          curl --fail --silent http://localhost:8080/docs | grep "SwaggerUIBundle"
          curl --fail --silent http://localhost:8080/metrics | grep "task_api_http_requests_total"
          curl --fail --silent http://localhost:8080/metrics | grep "task_api_http_request_duration_seconds_bucket"
          curl --fail --silent http://localhost:8080/version | \
            python3 -c 'import json,sys; data=json.load(sys.stdin)["data"]; assert data["version"]; assert data["commit"]; assert data["go_version"]'

      - name: Smoke test account security flows
        run: |
          register_response="$(curl --fail --silent \
            -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: ci-browser' \
            -d '{"name":"CI User","email":"ci@example.com","password":"password123"}')"
          access_token="$(printf '%s' "$register_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["access_token"])')"
          refresh_token="$(printf '%s' "$register_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["refresh_token"])')"

          sessions_response="$(curl --fail --silent \
            http://localhost:8080/api/auth/sessions \
            -H "Authorization: Bearer $access_token")"
          printf '%s' "$sessions_response" | python3 -c 'import json,sys; data=json.load(sys.stdin)["data"]; assert len(data) == 1; assert data[0]["user_agent"] == "ci-browser"'

          verify_request="$(curl --fail --silent \
            -X POST http://localhost:8080/api/auth/email-verification/request \
            -H "Authorization: Bearer $access_token")"
          verify_token="$(printf '%s' "$verify_request" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["development_token"])')"
          curl --fail --silent \
            -X POST http://localhost:8080/api/auth/email-verification/confirm \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$verify_token\"}" >/dev/null

          verify_replay_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST http://localhost:8080/api/auth/email-verification/confirm \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$verify_token\"}")"
          test "$verify_replay_status" = "401"

          forgot_response="$(curl --fail --silent \
            -X POST http://localhost:8080/api/auth/forgot-password \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com"}')"
          reset_token="$(printf '%s' "$forgot_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["development_token"])')"

          curl --fail --silent \
            -X POST http://localhost:8080/api/auth/reset-password \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$reset_token\",\"new_password\":\"new-password-456\"}" >/dev/null

          reset_replay_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST http://localhost:8080/api/auth/reset-password \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$reset_token\",\"new_password\":\"another-password-789\"}")"
          test "$reset_replay_status" = "401"

          old_refresh_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST http://localhost:8080/api/auth/refresh \
            -H 'Content-Type: application/json' \
            -d "{\"refresh_token\":\"$refresh_token\"}")"
          test "$old_refresh_status" = "401"

          login_response="$(curl --fail --silent \
            -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"new-password-456"}')"
          new_access="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["access_token"])')"
          new_refresh="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["refresh_token"])')"

          curl --fail --silent \
            -X POST http://localhost:8080/api/auth/logout-all \
            -H "Authorization: Bearer $new_access" >/dev/null

          logout_all_refresh_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST http://localhost:8080/api/auth/refresh \
            -H 'Content-Type: application/json' \
            -d "{\"refresh_token\":\"$new_refresh\"}")"
          test "$logout_all_refresh_status" = "401"

      - name: Smoke test enterprise organization administration
        run: |
          login_response="$(curl --fail --silent             -X POST http://localhost:8080/api/auth/login             -H 'Content-Type: application/json'             -d '{"email":"ci@example.com","password":"new-password-456"}')"
          token="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["access_token"])')"

          organization_response="$(curl --fail --silent             -X POST http://localhost:8080/api/organizations             -H "Authorization: Bearer $token"             -H 'Content-Type: application/json'             -d '{"name":"CI Enterprise","max_workspaces":2,"max_members":10}')"
          organization_id="$(printf '%s' "$organization_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])')"

          dashboard="$(curl --fail --silent             "http://localhost:8080/api/organizations/$organization_id/dashboard"             -H "Authorization: Bearer $token")"
          printf '%s' "$dashboard" | python3 -c 'import json,sys; data=json.load(sys.stdin)["data"]; assert data["member_count"] == 1; assert data["workspace_count"] == 0; assert data["member_capacity"] == 9; assert data["workspace_capacity"] == 2'

      - name: Smoke test enterprise billing and entitlements
        run: |
          login_response="$(curl --fail --silent             -X POST http://localhost:8080/api/auth/login             -H 'Content-Type: application/json'             -d '{"email":"ci@example.com","password":"new-password-456"}')"
          token="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["access_token"])')"

          organization_response="$(curl --fail --silent             -X POST http://localhost:8080/api/organizations             -H "Authorization: Bearer $token"             -H 'Content-Type: application/json'             -d '{"name":"CI Billing","max_workspaces":20,"max_members":100}')"
          organization_id="$(printf '%s' "$organization_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])')"

          plans="$(curl --fail --silent             http://localhost:8080/api/billing/plans             -H "Authorization: Bearer $token")"
          printf '%s' "$plans" | python3 -c 'import json,sys; codes={p["code"] for p in json.load(sys.stdin)["data"]}; assert {"free","pro","enterprise"}.issubset(codes)'

          subscription="$(curl --fail --silent             -X PUT "http://localhost:8080/api/organizations/$organization_id/billing/subscription"             -H "Authorization: Bearer $token"             -H 'Content-Type: application/json'             -d '{"plan_code":"pro"}')"
          printf '%s' "$subscription" | python3 -c 'import json,sys; data=json.load(sys.stdin)["data"]; assert data["plan_code"] == "pro"; assert data["status"] == "active"'

          curl --fail --silent             -X POST "http://localhost:8080/api/organizations/$organization_id/billing/usage"             -H "Authorization: Bearer $token"             -H 'Content-Type: application/json'             -d '{"metric":"api_operations","quantity":25}' >/dev/null

          dashboard="$(curl --fail --silent             "http://localhost:8080/api/organizations/$organization_id/billing/dashboard"             -H "Authorization: Bearer $token")"
          printf '%s' "$dashboard" | python3 -c 'import json,sys; data=json.load(sys.stdin)["data"]; assert data["plan"]["code"] == "pro"; assert data["limits"]["max_members"] == 1000; assert any(u["metric"] == "api_operations" and u["quantity"] == 25 for u in data["usage"]); assert len(data["recent_invoices"]) == 1'

      - name: Smoke test enterprise operations control plane
        run: |
          login_response="$(curl --fail --silent -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"new-password-456"}')"
          token="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["access_token"])')"

          organization_response="$(curl --fail --silent -X POST http://localhost:8080/api/organizations -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"CI Operations","max_workspaces":20,"max_members":100}')"
          organization_id="$(printf '%s' "$organization_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])')"

          curl --fail --silent -X PUT "http://localhost:8080/api/organizations/$organization_id/operations/policy" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"monthly_budget_cents":10000,"budget_alert_threshold_percent":80,"slo_target_basis_points":9990,"incident_escalation_minutes":1,"support_tier":"priority","support_contact":"ops@example.com"}' >/dev/null

          cost_start="$(python3 -c 'import datetime; now=datetime.datetime.now(datetime.timezone.utc); print((now-datetime.timedelta(hours=1)).isoformat().replace("+00:00","Z"))')"
          cost_end="$(python3 -c 'import datetime; print(datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00","Z"))')"
          incident_start="$(python3 -c 'import datetime; now=datetime.datetime.now(datetime.timezone.utc); print((now-datetime.timedelta(hours=1)).isoformat().replace("+00:00","Z"))')"
          maint_start="$(python3 -c 'import datetime; now=datetime.datetime.now(datetime.timezone.utc); print((now+datetime.timedelta(hours=1)).isoformat().replace("+00:00","Z"))')"
          maint_end="$(python3 -c 'import datetime; now=datetime.datetime.now(datetime.timezone.utc); print((now+datetime.timedelta(hours=2)).isoformat().replace("+00:00","Z"))')"

          cost_payload="$(python3 -c 'import json,sys; print(json.dumps({"category":"compute","source":"ci","amount_cents":9000,"period_start":sys.argv[1],"period_end":sys.argv[2]}))' "$cost_start" "$cost_end")"
          incident_payload="$(python3 -c 'import json,sys; print(json.dumps({"title":"CI incident","severity":"sev1","summary":"runtime smoke","started_at":sys.argv[1]}))' "$incident_start")"
          maintenance_payload="$(python3 -c 'import json,sys; print(json.dumps({"title":"CI maintenance","starts_at":sys.argv[1],"ends_at":sys.argv[2]}))' "$maint_start" "$maint_end")"

          curl --fail --silent -X POST "http://localhost:8080/api/organizations/$organization_id/operations/costs" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$cost_payload" >/dev/null
          curl --fail --silent -X POST "http://localhost:8080/api/organizations/$organization_id/operations/incidents" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$incident_payload" >/dev/null
          curl --fail --silent -X POST "http://localhost:8080/api/organizations/$organization_id/operations/maintenance" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$maintenance_payload" >/dev/null

          evaluated="$(curl --fail --silent -X POST "http://localhost:8080/api/organizations/$organization_id/operations/evaluate" -H "Authorization: Bearer $token")"
          printf '%s' "$evaluated" | python3 -c 'import json,sys; alerts=json.load(sys.stdin)["data"]; types={a["type"] for a in alerts}; assert "budget_threshold" in types; assert "incident_escalation" in types; assert "slo_breach" in types'

          dashboard="$(curl --fail --silent "http://localhost:8080/api/organizations/$organization_id/operations/dashboard" -H "Authorization: Bearer $token")"
          printf '%s' "$dashboard" | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["policy"]["support_tier"] == "priority"; assert d["current_spend_cents"] >= 8990; assert len(d["open_incidents"]) == 1; assert len(d["upcoming_maintenance"]) == 1; assert len(d["capacity_forecasts"]) == 1'

      - name: Smoke test enterprise automation and approvals
        run: |
          login_response="$(curl --fail --silent -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"new-password-456"}')"
          token="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["access_token"])')"

          organization_response="$(curl --fail --silent -X POST http://localhost:8080/api/organizations -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"CI Automation","max_workspaces":20,"max_members":100}')"
          organization_id="$(printf '%s' "$organization_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])')"

          curl --fail --silent -X POST "http://localhost:8080/api/organizations/$organization_id/billing/usage" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"metric":"api_operations","quantity":6000}' >/dev/null

          policy="$(curl --fail --silent -X POST "http://localhost:8080/api/organizations/$organization_id/automation/policies" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"Approve high API usage incident","trigger_type":"billing_usage_percent","trigger_key":"api_operations","comparator":"gte","threshold":50,"action_type":"operations.open_incident","action_config":{"severity":"sev1","title":"API usage requires attention","summary":"Created after explicit approval"},"approval_mode":"required","cooldown_minutes":60}')"
          printf '%s' "$policy" | python3 -c 'import json,sys; p=json.load(sys.stdin)["data"]; assert p["trigger_type"] == "billing_usage_percent"; assert p["approval_mode"] == "required"'

          evaluation="$(curl --fail --silent -X POST "http://localhost:8080/api/organizations/$organization_id/automation/evaluate" -H "Authorization: Bearer $token")"
          execution_id="$(printf '%s' "$evaluation" | python3 -c 'import json,sys; items=json.load(sys.stdin)["data"]; assert len(items)==1; assert items[0]["status"]=="pending_approval"; print(items[0]["id"])')"

          approved="$(curl --fail --silent -X POST "http://localhost:8080/api/organizations/$organization_id/automation/executions/$execution_id/decision" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"approve":true}')"
          printf '%s' "$approved" | python3 -c 'import json,sys; e=json.load(sys.stdin)["data"]; assert e["status"]=="succeeded"; assert e["action_result"]["severity"]=="sev1"'

          incidents="$(curl --fail --silent "http://localhost:8080/api/organizations/$organization_id/operations/incidents" -H "Authorization: Bearer $token")"
