name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Prepare modules
        run: go mod tidy

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./cmd/...

  integration:
    name: PostgreSQL Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: task_user
          POSTGRES_PASSWORD: task_password
          POSTGRES_DB: task_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_user -d task_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Prepare modules
        run: go mod tidy

      - name: Run migrations twice
        env:
          DATABASE_URL: postgres://task_user:task_password@localhost:5432/task_manager_test?sslmode=disable
          MIGRATIONS_DIR: migrations
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate

      - name: PostgreSQL repository integration tests
        env:
          TEST_DATABASE_URL: postgres://task_user:task_password@localhost:5432/task_manager_test?sslmode=disable
        run: go test -tags=integration -race ./internal/repository -run Integration -v

  manifests:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Render production manifests
        run: |
          kubectl kustomize deploy/k8s/overlays/production > /tmp/kubernetes.yaml
          test -s /tmp/kubernetes.yaml
          grep -q '^kind: Deployment    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, integration, manifests]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and start stack
        env:
          JWT_SECRET: ci-local-secret-123456789012345678901234
          EXPOSE_AUTH_TOKENS: "true"
          AUTH_RATE_LIMIT_REQUESTS: "100"
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Smoke test system endpoints
        run: |
          curl --fail --silent http://localhost:8080/health | grep "API is healthy"
          curl --fail --silent http://localhost:8080/ready | grep "API is ready"
          curl --fail --silent http://localhost:8080/openapi.yaml | grep "openapi: 3.1.0"
          curl --fail --silent http://localhost:8080/docs | grep "SwaggerUIBundle"
          curl --fail --silent http://localhost:8080/metrics | grep "task_api_http_requests_total"
          curl --fail --silent http://localhost:8080/version | python3 -c 'import json,sys; data=json.load(sys.stdin)["data"]; assert data["version"]; assert data["commit"]; assert data["go_version"]'

      - name: Smoke test account security flows
        run: |
          register_response="$(curl --fail --silent             -X POST http://localhost:8080/api/auth/register             -H 'Content-Type: application/json'             -H 'User-Agent: ci-browser'             -d '{"name":"CI User","email":"ci@example.com","password":"password123"}')"
          access_token="$(printf '%s' "$register_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["access_token"])')"
          refresh_token="$(printf '%s' "$register_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["refresh_token"])')"

          sessions_response="$(curl --fail --silent             http://localhost:8080/api/auth/sessions             -H "Authorization: Bearer $access_token")"
          printf '%s' "$sessions_response" | python3 -c 'import json,sys; data=json.load(sys.stdin)["data"]; assert len(data) == 1; assert data[0]["user_agent"] == "ci-browser"'

          verify_request="$(curl --fail --silent             -X POST http://localhost:8080/api/auth/email-verification/request             -H "Authorization: Bearer $access_token")"
          verify_token="$(printf '%s' "$verify_request" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["development_token"])')"
          curl --fail --silent             -X POST http://localhost:8080/api/auth/email-verification/confirm             -H 'Content-Type: application/json'             -d "{\"token\":\"$verify_token\"}" >/dev/null

          verify_replay_status="$(curl --silent --output /dev/null --write-out '%{http_code}'             -X POST http://localhost:8080/api/auth/email-verification/confirm             -H 'Content-Type: application/json'             -d "{\"token\":\"$verify_token\"}")"
          test "$verify_replay_status" = "401"

          forgot_response="$(curl --fail --silent             -X POST http://localhost:8080/api/auth/forgot-password             -H 'Content-Type: application/json'             -d '{"email":"ci@example.com"}')"
          reset_token="$(printf '%s' "$forgot_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["development_token"])')"

          curl --fail --silent             -X POST http://localhost:8080/api/auth/reset-password             -H 'Content-Type: application/json'             -d "{\"token\":\"$reset_token\",\"new_password\":\"new-password-456\"}" >/dev/null

          reset_replay_status="$(curl --silent --output /dev/null --write-out '%{http_code}'             -X POST http://localhost:8080/api/auth/reset-password             -H 'Content-Type: application/json'             -d "{\"token\":\"$reset_token\",\"new_password\":\"another-password-789\"}")"
          test "$reset_replay_status" = "401"

          old_refresh_status="$(curl --silent --output /dev/null --write-out '%{http_code}'             -X POST http://localhost:8080/api/auth/refresh             -H 'Content-Type: application/json'             -d "{\"refresh_token\":\"$refresh_token\"}")"
          test "$old_refresh_status" = "401"

          login_response="$(curl --fail --silent             -X POST http://localhost:8080/api/auth/login             -H 'Content-Type: application/json'             -d '{"email":"ci@example.com","password":"new-password-456"}')"
          new_access="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["access_token"])')"
          new_refresh="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["refresh_token"])')"

          curl --fail --silent             -X POST http://localhost:8080/api/auth/logout-all             -H "Authorization: Bearer $new_access" >/dev/null

          logout_all_refresh_status="$(curl --silent --output /dev/null --write-out '%{http_code}'             -X POST http://localhost:8080/api/auth/refresh             -H 'Content-Type: application/json'             -d "{\"refresh_token\":\"$new_refresh\"}")"
          test "$logout_all_refresh_status" = "401"

      - name: Validate production operations
        run: |
          migration_count="$(docker compose exec -T postgres psql -U task_user -d task_manager -tAc 'SELECT COUNT(*) FROM schema_migrations')"
          test "$migration_count" = "5"

          docker compose exec -T redis sh -c "redis-cli --scan --pattern 'task-api:auth-rate:*' | grep -q 'task-api:auth-rate:'"

          docker compose logs api | grep '"msg":"http_request"'
          docker compose logs api | grep '"request_id"'

      - name: Show container status
        run: docker compose ps

      - name: Stop stack
        if: always()
        run: docker compose down -v
