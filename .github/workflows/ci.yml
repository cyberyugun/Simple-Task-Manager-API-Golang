name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Prepare modules
        run: go mod tidy

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./cmd/api

  integration:
    name: PostgreSQL Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: task_user
          POSTGRES_PASSWORD: task_password
          POSTGRES_DB: task_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_user -d task_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Prepare modules
        run: go mod tidy

      - name: PostgreSQL repository integration tests
        env:
          TEST_DATABASE_URL: postgres://task_user:task_password@localhost:5432/task_manager_test?sslmode=disable
        run: go test -tags=integration -race ./internal/repository -run Integration -v

  container:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, integration]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and start stack
        env:
          JWT_SECRET: ci-local-secret-123456789012345678901234
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Smoke test API docs
        run: |
          curl --fail --silent http://localhost:8080/openapi.yaml | grep "openapi: 3.1.0"
          curl --fail --silent http://localhost:8080/docs | grep "SwaggerUIBundle"

      - name: Smoke test refresh token rotation
        run: |
          register_response="$(curl --fail --silent             -X POST http://localhost:8080/api/auth/register             -H 'Content-Type: application/json'             -d '{"name":"CI User","email":"ci@example.com","password":"password123"}')"
          old_refresh="$(printf '%s' "$register_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["refresh_token"])')"

          refresh_response="$(curl --fail --silent             -X POST http://localhost:8080/api/auth/refresh             -H 'Content-Type: application/json'             -d "{\"refresh_token\":\"$old_refresh\"}")"
          new_refresh="$(printf '%s' "$refresh_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["refresh_token"])')"

          test "$old_refresh" != "$new_refresh"

          replay_status="$(curl --silent --output /dev/null --write-out '%{http_code}'             -X POST http://localhost:8080/api/auth/refresh             -H 'Content-Type: application/json'             -d "{\"refresh_token\":\"$old_refresh\"}")"
          test "$replay_status" = "401"

          curl --fail --silent             -X POST http://localhost:8080/api/auth/logout             -H 'Content-Type: application/json'             -d "{\"refresh_token\":\"$new_refresh\"}" >/dev/null

          after_logout_status="$(curl --silent --output /dev/null --write-out '%{http_code}'             -X POST http://localhost:8080/api/auth/refresh             -H 'Content-Type: application/json'             -d "{\"refresh_token\":\"$new_refresh\"}")"
          test "$after_logout_status" = "401"

      - name: Show container status
        run: docker compose ps

      - name: Stop stack
        if: always()
        run: docker compose down -v
