name: Backup Restore Verification

on:
  schedule:
    - cron: "30 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-drill:
    name: PostgreSQL restore drill
    if: vars.BACKUP_RESTORE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: backup-restore
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
      ALLOW_RESTORE_TARGET_RESET: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Run isolated restore drill
        run: bash scripts/postgres-backup-restore-check.sh
