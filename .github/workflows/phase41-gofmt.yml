name: Phase 41 Gofmt

on:
  push:
    branches:
      - phase-41-ai-assisted-task-workflow-intelligence

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-41-ai-assisted-task-workflow-intelligence
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Format
        run: gofmt -w cmd/api/main.go internal/model/ai_assistance.go internal/repository/ai_assistance_repository.go internal/repository/postgres_ai_assistance_repository.go internal/repository/ai_assistance_postgres_integration_test.go internal/repository/postgres_integration_test.go internal/service/ai_assistance_service.go internal/service/ai_assistance_service_test.go internal/handler/ai_assistance_handler.go
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(phase-41): gofmt AI assistance"
          git push origin HEAD:phase-41-ai-assisted-task-workflow-intelligence
