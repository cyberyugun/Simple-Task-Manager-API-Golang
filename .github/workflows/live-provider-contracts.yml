name: Live Provider Contracts

on:
  workflow_dispatch:
    inputs:
      target:
        description: Live provider contract target
        required: true
        type: choice
        options:
          - storage_s3
          - storage_azure
          - storage_gcs
          - scanner
          - secret_vault
          - secret_aws
          - secret_azure
          - secret_gcp
      scanner_storage_target:
        description: Storage provider used by scanner fixture
        required: false
        default: storage_s3
        type: choice
        options:
          - storage_s3
          - storage_azure
          - storage_gcs

permissions:
  contents: read

jobs:
  provider-contract:
    name: Live Provider Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      LIVE_PROVIDER_CONTRACT_TARGET: ${{ inputs.target }}
      LIVE_PROVIDER_STORAGE_TARGET: ${{ inputs.scanner_storage_target }}
      LIVE_PROVIDER_ALLOW_INSECURE: "false"

      ATTACHMENT_STORAGE_PROVIDER: ${{ secrets.CONTRACT_ATTACHMENT_STORAGE_PROVIDER }}
      ATTACHMENT_STORAGE_BUCKET: ${{ secrets.CONTRACT_ATTACHMENT_STORAGE_BUCKET }}
      ATTACHMENT_ENCRYPTION: ${{ secrets.CONTRACT_ATTACHMENT_ENCRYPTION }}
      ATTACHMENT_ENCRYPTION_KEY_ID: ${{ secrets.CONTRACT_ATTACHMENT_ENCRYPTION_KEY_ID }}

      ATTACHMENT_S3_REGION: ${{ secrets.CONTRACT_ATTACHMENT_S3_REGION }}
      ATTACHMENT_S3_ENDPOINT: ${{ secrets.CONTRACT_ATTACHMENT_S3_ENDPOINT }}
      ATTACHMENT_S3_STS_ENDPOINT: ${{ secrets.CONTRACT_ATTACHMENT_S3_STS_ENDPOINT }}
      ATTACHMENT_S3_ROLE_ARN: ${{ secrets.CONTRACT_ATTACHMENT_S3_ROLE_ARN }}
      ATTACHMENT_S3_WEB_IDENTITY_TOKEN_FILE: ${{ secrets.CONTRACT_ATTACHMENT_S3_WEB_IDENTITY_TOKEN_FILE }}
      ATTACHMENT_S3_ROLE_SESSION_NAME: ${{ secrets.CONTRACT_ATTACHMENT_S3_ROLE_SESSION_NAME }}
      ATTACHMENT_S3_FORCE_PATH_STYLE: ${{ secrets.CONTRACT_ATTACHMENT_S3_FORCE_PATH_STYLE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CONTRACT_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CONTRACT_AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.CONTRACT_AWS_SESSION_TOKEN }}

      ATTACHMENT_AZURE_STORAGE_ACCOUNT: ${{ secrets.CONTRACT_ATTACHMENT_AZURE_STORAGE_ACCOUNT }}
      ATTACHMENT_AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.CONTRACT_ATTACHMENT_AZURE_STORAGE_ACCOUNT_KEY }}
      ATTACHMENT_AZURE_BLOB_ENDPOINT: ${{ secrets.CONTRACT_ATTACHMENT_AZURE_BLOB_ENDPOINT }}
      ATTACHMENT_AZURE_ACCESS_TOKEN: ${{ secrets.CONTRACT_ATTACHMENT_AZURE_ACCESS_TOKEN }}
      ATTACHMENT_AZURE_USE_MANAGED_IDENTITY: ${{ secrets.CONTRACT_ATTACHMENT_AZURE_USE_MANAGED_IDENTITY }}
      ATTACHMENT_AZURE_MANAGED_IDENTITY_ENDPOINT: ${{ secrets.CONTRACT_ATTACHMENT_AZURE_MANAGED_IDENTITY_ENDPOINT }}
      AZURE_TENANT_ID: ${{ secrets.CONTRACT_AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.CONTRACT_AZURE_CLIENT_ID }}
      AZURE_FEDERATED_TOKEN_FILE: ${{ secrets.CONTRACT_AZURE_FEDERATED_TOKEN_FILE }}
      AZURE_AUTHORITY_HOST: ${{ secrets.CONTRACT_AZURE_AUTHORITY_HOST }}

      ATTACHMENT_GCS_ENDPOINT: ${{ secrets.CONTRACT_ATTACHMENT_GCS_ENDPOINT }}
      ATTACHMENT_GCS_SERVICE_ACCOUNT_EMAIL: ${{ secrets.CONTRACT_ATTACHMENT_GCS_SERVICE_ACCOUNT_EMAIL }}
      ATTACHMENT_GCS_IAM_CREDENTIALS_ENDPOINT: ${{ secrets.CONTRACT_ATTACHMENT_GCS_IAM_CREDENTIALS_ENDPOINT }}
      ATTACHMENT_GCS_ACCESS_TOKEN: ${{ secrets.CONTRACT_ATTACHMENT_GCS_ACCESS_TOKEN }}
      ATTACHMENT_GCS_USE_METADATA: ${{ secrets.CONTRACT_ATTACHMENT_GCS_USE_METADATA }}
      ATTACHMENT_GCS_METADATA_ENDPOINT: ${{ secrets.CONTRACT_ATTACHMENT_GCS_METADATA_ENDPOINT }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.CONTRACT_GOOGLE_SERVICE_ACCOUNT_EMAIL }}

      ATTACHMENT_SCANNER_URL: ${{ secrets.CONTRACT_ATTACHMENT_SCANNER_URL }}
      ATTACHMENT_SCANNER_BEARER_TOKEN: ${{ secrets.CONTRACT_ATTACHMENT_SCANNER_BEARER_TOKEN }}
      ATTACHMENT_SCANNER_SIGNING_SECRET: ${{ secrets.CONTRACT_ATTACHMENT_SCANNER_SIGNING_SECRET }}

      CONNECTOR_VAULT_ADDR: ${{ secrets.CONTRACT_CONNECTOR_VAULT_ADDR }}
      CONNECTOR_VAULT_TOKEN: ${{ secrets.CONTRACT_CONNECTOR_VAULT_TOKEN }}
      CONNECTOR_VAULT_NAMESPACE: ${{ secrets.CONTRACT_CONNECTOR_VAULT_NAMESPACE }}
      CONNECTOR_VAULT_KV_MOUNT: ${{ secrets.CONTRACT_CONNECTOR_VAULT_KV_MOUNT }}
      CONNECTOR_VAULT_PREFIX: ${{ secrets.CONTRACT_CONNECTOR_VAULT_PREFIX }}
      CONNECTOR_VAULT_TIMEOUT: ${{ secrets.CONTRACT_CONNECTOR_VAULT_TIMEOUT }}

      CONNECTOR_AWS_REGION: ${{ secrets.CONTRACT_CONNECTOR_AWS_REGION }}
      CONNECTOR_AWS_SECRET_PREFIX: ${{ secrets.CONTRACT_CONNECTOR_AWS_SECRET_PREFIX }}
      CONNECTOR_AWS_KMS_KEY_ID: ${{ secrets.CONTRACT_CONNECTOR_AWS_KMS_KEY_ID }}
      CONNECTOR_AWS_SECRETS_ENDPOINT: ${{ secrets.CONTRACT_CONNECTOR_AWS_SECRETS_ENDPOINT }}
      CONNECTOR_AWS_STS_ENDPOINT: ${{ secrets.CONTRACT_CONNECTOR_AWS_STS_ENDPOINT }}
      CONNECTOR_AWS_RECOVERY_WINDOW_DAYS: ${{ secrets.CONTRACT_CONNECTOR_AWS_RECOVERY_WINDOW_DAYS }}
      CONNECTOR_AWS_TIMEOUT: ${{ secrets.CONTRACT_CONNECTOR_AWS_TIMEOUT }}

      CONNECTOR_AZURE_KEY_VAULT_URL: ${{ secrets.CONTRACT_CONNECTOR_AZURE_KEY_VAULT_URL }}
      CONNECTOR_AZURE_SECRET_PREFIX: ${{ secrets.CONTRACT_CONNECTOR_AZURE_SECRET_PREFIX }}
      CONNECTOR_AZURE_ACCESS_TOKEN: ${{ secrets.CONTRACT_CONNECTOR_AZURE_ACCESS_TOKEN }}
      CONNECTOR_AZURE_USE_MANAGED_IDENTITY: ${{ secrets.CONTRACT_CONNECTOR_AZURE_USE_MANAGED_IDENTITY }}
      CONNECTOR_AZURE_MANAGED_IDENTITY_ENDPOINT: ${{ secrets.CONTRACT_CONNECTOR_AZURE_MANAGED_IDENTITY_ENDPOINT }}
      CONNECTOR_AZURE_CMK_KEY_ID: ${{ secrets.CONTRACT_CONNECTOR_AZURE_CMK_KEY_ID }}
      CONNECTOR_AZURE_TIMEOUT: ${{ secrets.CONTRACT_CONNECTOR_AZURE_TIMEOUT }}

      CONNECTOR_GCP_PROJECT_ID: ${{ secrets.CONTRACT_CONNECTOR_GCP_PROJECT_ID }}
      CONNECTOR_GCP_SECRET_PREFIX: ${{ secrets.CONTRACT_CONNECTOR_GCP_SECRET_PREFIX }}
      CONNECTOR_GCP_CMEK_KEY_NAME: ${{ secrets.CONTRACT_CONNECTOR_GCP_CMEK_KEY_NAME }}
      CONNECTOR_GCP_SECRET_MANAGER_ENDPOINT: ${{ secrets.CONTRACT_CONNECTOR_GCP_SECRET_MANAGER_ENDPOINT }}
      CONNECTOR_GCP_ACCESS_TOKEN: ${{ secrets.CONTRACT_CONNECTOR_GCP_ACCESS_TOKEN }}
      CONNECTOR_GCP_USE_METADATA: ${{ secrets.CONTRACT_CONNECTOR_GCP_USE_METADATA }}
      CONNECTOR_GCP_METADATA_ENDPOINT: ${{ secrets.CONTRACT_CONNECTOR_GCP_METADATA_ENDPOINT }}
      CONNECTOR_GCP_TIMEOUT: ${{ secrets.CONTRACT_CONNECTOR_GCP_TIMEOUT }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Run live provider contract
        run: |
          set -o pipefail
          bash scripts/live-provider-contracts.sh 2>&1 | tee live-provider-contract.log

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-provider-contract-${{ inputs.target }}-${{ github.run_id }}
          path: live-provider-contract.log
          if-no-files-found: error
          retention-days: 30
