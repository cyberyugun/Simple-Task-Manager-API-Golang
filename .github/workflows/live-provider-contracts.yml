name: Live Provider Contracts

on:
  workflow_dispatch:
    inputs:
      target:
        description: Live provider contract target
        required: true
        type: choice
        options:
          - storage_s3
          - storage_azure
          - storage_gcs
          - scanner
          - secret_vault
          - secret_aws
          - secret_azure
          - secret_gcp
          - warehouse_bigquery
          - warehouse_snowflake
          - warehouse_redshift
          - warehouse_databricks
          - ai_remote
          - region_automation
      environment:
        description: Provider environment label recorded in evidence
        required: true
        default: staging
        type: choice
        options:
          - development
          - staging
          - production
      scanner_storage_target:
        description: Storage provider used by scanner fixture
        required: false
        default: storage_s3
        type: choice
        options:
          - storage_s3
          - storage_azure
          - storage_gcs

permissions:
  contents: read

jobs:
  provider-contract:
    name: Live Provider Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      LIVE_PROVIDER_CONTRACT_TARGET: ${{ inputs.target }}
      LIVE_PROVIDER_STORAGE_TARGET: ${{ inputs.scanner_storage_target }}
      LIVE_PROVIDER_ALLOW_INSECURE: "false"
      LIVE_PROVIDER_ENVIRONMENT: ${{ inputs.environment }}

      ATTACHMENT_STORAGE_PROVIDER: ${{ secrets.CONTRACT_ATTACHMENT_STORAGE_PROVIDER }}
      ATTACHMENT_STORAGE_BUCKET: ${{ secrets.CONTRACT_ATTACHMENT_STORAGE_BUCKET }}
      ATTACHMENT_ENCRYPTION: ${{ secrets.CONTRACT_ATTACHMENT_ENCRYPTION }}
      ATTACHMENT_ENCRYPTION_KEY_ID: ${{ secrets.CONTRACT_ATTACHMENT_ENCRYPTION_KEY_ID }}

      ATTACHMENT_S3_REGION: ${{ secrets.CONTRACT_ATTACHMENT_S3_REGION }}
      ATTACHMENT_S3_ENDPOINT: ${{ secrets.CONTRACT_ATTACHMENT_S3_ENDPOINT }}
      ATTACHMENT_S3_STS_ENDPOINT: ${{ secrets.CONTRACT_ATTACHMENT_S3_STS_ENDPOINT }}
      ATTACHMENT_S3_ROLE_ARN: ${{ secrets.CONTRACT_ATTACHMENT_S3_ROLE_ARN }}
      ATTACHMENT_S3_WEB_IDENTITY_TOKEN_FILE: ${{ secrets.CONTRACT_ATTACHMENT_S3_WEB_IDENTITY_TOKEN_FILE }}
      ATTACHMENT_S3_ROLE_SESSION_NAME: ${{ secrets.CONTRACT_ATTACHMENT_S3_ROLE_SESSION_NAME }}
      ATTACHMENT_S3_FORCE_PATH_STYLE: ${{ secrets.CONTRACT_ATTACHMENT_S3_FORCE_PATH_STYLE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CONTRACT_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CONTRACT_AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.CONTRACT_AWS_SESSION_TOKEN }}
      AWS_ROLE_ARN: ${{ secrets.CONTRACT_AWS_ROLE_ARN }}
      AWS_WEB_IDENTITY_TOKEN_FILE: ${{ secrets.CONTRACT_AWS_WEB_IDENTITY_TOKEN_FILE }}
      AWS_ROLE_SESSION_NAME: ${{ secrets.CONTRACT_AWS_ROLE_SESSION_NAME }}

      ATTACHMENT_AZURE_STORAGE_ACCOUNT: ${{ secrets.CONTRACT_ATTACHMENT_AZURE_STORAGE_ACCOUNT }}
      ATTACHMENT_AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.CONTRACT_ATTACHMENT_AZURE_STORAGE_ACCOUNT_KEY }}
      ATTACHMENT_AZURE_BLOB_ENDPOINT: ${{ secrets.CONTRACT_ATTACHMENT_AZURE_BLOB_ENDPOINT }}
      ATTACHMENT_AZURE_ACCESS_TOKEN: ${{ secrets.CONTRACT_ATTACHMENT_AZURE_ACCESS_TOKEN }}
      ATTACHMENT_AZURE_USE_MANAGED_IDENTITY: ${{ secrets.CONTRACT_ATTACHMENT_AZURE_USE_MANAGED_IDENTITY }}
      ATTACHMENT_AZURE_MANAGED_IDENTITY_ENDPOINT: ${{ secrets.CONTRACT_ATTACHMENT_AZURE_MANAGED_IDENTITY_ENDPOINT }}
      AZURE_TENANT_ID: ${{ secrets.CONTRACT_AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.CONTRACT_AZURE_CLIENT_ID }}
      AZURE_FEDERATED_TOKEN_FILE: ${{ secrets.CONTRACT_AZURE_FEDERATED_TOKEN_FILE }}
      AZURE_AUTHORITY_HOST: ${{ secrets.CONTRACT_AZURE_AUTHORITY_HOST }}

      ATTACHMENT_GCS_ENDPOINT: ${{ secrets.CONTRACT_ATTACHMENT_GCS_ENDPOINT }}
      ATTACHMENT_GCS_SERVICE_ACCOUNT_EMAIL: ${{ secrets.CONTRACT_ATTACHMENT_GCS_SERVICE_ACCOUNT_EMAIL }}
      ATTACHMENT_GCS_IAM_CREDENTIALS_ENDPOINT: ${{ secrets.CONTRACT_ATTACHMENT_GCS_IAM_CREDENTIALS_ENDPOINT }}
      ATTACHMENT_GCS_ACCESS_TOKEN: ${{ secrets.CONTRACT_ATTACHMENT_GCS_ACCESS_TOKEN }}
      ATTACHMENT_GCS_USE_METADATA: ${{ secrets.CONTRACT_ATTACHMENT_GCS_USE_METADATA }}
      ATTACHMENT_GCS_METADATA_ENDPOINT: ${{ secrets.CONTRACT_ATTACHMENT_GCS_METADATA_ENDPOINT }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.CONTRACT_GOOGLE_SERVICE_ACCOUNT_EMAIL }}

      ATTACHMENT_SCANNER_URL: ${{ secrets.CONTRACT_ATTACHMENT_SCANNER_URL }}
      ATTACHMENT_SCANNER_BEARER_TOKEN: ${{ secrets.CONTRACT_ATTACHMENT_SCANNER_BEARER_TOKEN }}
      ATTACHMENT_SCANNER_SIGNING_SECRET: ${{ secrets.CONTRACT_ATTACHMENT_SCANNER_SIGNING_SECRET }}

      CONNECTOR_VAULT_ADDR: ${{ secrets.CONTRACT_CONNECTOR_VAULT_ADDR }}
      CONNECTOR_VAULT_TOKEN: ${{ secrets.CONTRACT_CONNECTOR_VAULT_TOKEN }}
      CONNECTOR_VAULT_NAMESPACE: ${{ secrets.CONTRACT_CONNECTOR_VAULT_NAMESPACE }}
      CONNECTOR_VAULT_KV_MOUNT: ${{ secrets.CONTRACT_CONNECTOR_VAULT_KV_MOUNT }}
      CONNECTOR_VAULT_PREFIX: ${{ secrets.CONTRACT_CONNECTOR_VAULT_PREFIX }}
      CONNECTOR_VAULT_TIMEOUT: ${{ secrets.CONTRACT_CONNECTOR_VAULT_TIMEOUT }}

      CONNECTOR_AWS_REGION: ${{ secrets.CONTRACT_CONNECTOR_AWS_REGION }}
      CONNECTOR_AWS_SECRET_PREFIX: ${{ secrets.CONTRACT_CONNECTOR_AWS_SECRET_PREFIX }}
      CONNECTOR_AWS_KMS_KEY_ID: ${{ secrets.CONTRACT_CONNECTOR_AWS_KMS_KEY_ID }}
      CONNECTOR_AWS_SECRETS_ENDPOINT: ${{ secrets.CONTRACT_CONNECTOR_AWS_SECRETS_ENDPOINT }}
      CONNECTOR_AWS_STS_ENDPOINT: ${{ secrets.CONTRACT_CONNECTOR_AWS_STS_ENDPOINT }}
      CONNECTOR_AWS_RECOVERY_WINDOW_DAYS: ${{ secrets.CONTRACT_CONNECTOR_AWS_RECOVERY_WINDOW_DAYS }}
      CONNECTOR_AWS_TIMEOUT: ${{ secrets.CONTRACT_CONNECTOR_AWS_TIMEOUT }}

      CONNECTOR_AZURE_KEY_VAULT_URL: ${{ secrets.CONTRACT_CONNECTOR_AZURE_KEY_VAULT_URL }}
      CONNECTOR_AZURE_SECRET_PREFIX: ${{ secrets.CONTRACT_CONNECTOR_AZURE_SECRET_PREFIX }}
      CONNECTOR_AZURE_ACCESS_TOKEN: ${{ secrets.CONTRACT_CONNECTOR_AZURE_ACCESS_TOKEN }}
      CONNECTOR_AZURE_USE_MANAGED_IDENTITY: ${{ secrets.CONTRACT_CONNECTOR_AZURE_USE_MANAGED_IDENTITY }}
      CONNECTOR_AZURE_MANAGED_IDENTITY_ENDPOINT: ${{ secrets.CONTRACT_CONNECTOR_AZURE_MANAGED_IDENTITY_ENDPOINT }}
      CONNECTOR_AZURE_CMK_KEY_ID: ${{ secrets.CONTRACT_CONNECTOR_AZURE_CMK_KEY_ID }}
      CONNECTOR_AZURE_TIMEOUT: ${{ secrets.CONTRACT_CONNECTOR_AZURE_TIMEOUT }}

      CONNECTOR_GCP_PROJECT_ID: ${{ secrets.CONTRACT_CONNECTOR_GCP_PROJECT_ID }}
      CONNECTOR_GCP_SECRET_PREFIX: ${{ secrets.CONTRACT_CONNECTOR_GCP_SECRET_PREFIX }}
      CONNECTOR_GCP_CMEK_KEY_NAME: ${{ secrets.CONTRACT_CONNECTOR_GCP_CMEK_KEY_NAME }}
      CONNECTOR_GCP_SECRET_MANAGER_ENDPOINT: ${{ secrets.CONTRACT_CONNECTOR_GCP_SECRET_MANAGER_ENDPOINT }}
      CONNECTOR_GCP_ACCESS_TOKEN: ${{ secrets.CONTRACT_CONNECTOR_GCP_ACCESS_TOKEN }}
      CONNECTOR_GCP_USE_METADATA: ${{ secrets.CONTRACT_CONNECTOR_GCP_USE_METADATA }}
      CONNECTOR_GCP_METADATA_ENDPOINT: ${{ secrets.CONTRACT_CONNECTOR_GCP_METADATA_ENDPOINT }}
      CONNECTOR_GCP_TIMEOUT: ${{ secrets.CONTRACT_CONNECTOR_GCP_TIMEOUT }}

      LIVE_WAREHOUSE_TABLE: ${{ secrets.CONTRACT_LIVE_WAREHOUSE_TABLE }}

      DATA_PLATFORM_BIGQUERY_ENDPOINT: ${{ secrets.CONTRACT_DATA_PLATFORM_BIGQUERY_ENDPOINT }}
      DATA_PLATFORM_BIGQUERY_ACCESS_TOKEN: ${{ secrets.CONTRACT_DATA_PLATFORM_BIGQUERY_ACCESS_TOKEN }}
      DATA_PLATFORM_BIGQUERY_USE_METADATA: ${{ secrets.CONTRACT_DATA_PLATFORM_BIGQUERY_USE_METADATA }}
      DATA_PLATFORM_BIGQUERY_METADATA_ENDPOINT: ${{ secrets.CONTRACT_DATA_PLATFORM_BIGQUERY_METADATA_ENDPOINT }}
      DATA_PLATFORM_BIGQUERY_TIMEOUT: ${{ secrets.CONTRACT_DATA_PLATFORM_BIGQUERY_TIMEOUT }}
      LIVE_WAREHOUSE_BIGQUERY_PROJECT_ID: ${{ secrets.CONTRACT_LIVE_WAREHOUSE_BIGQUERY_PROJECT_ID }}
      LIVE_WAREHOUSE_BIGQUERY_DATASET: ${{ secrets.CONTRACT_LIVE_WAREHOUSE_BIGQUERY_DATASET }}

      DATA_PLATFORM_SNOWFLAKE_ENDPOINT: ${{ secrets.CONTRACT_DATA_PLATFORM_SNOWFLAKE_ENDPOINT }}
      DATA_PLATFORM_SNOWFLAKE_TOKEN: ${{ secrets.CONTRACT_DATA_PLATFORM_SNOWFLAKE_TOKEN }}
      DATA_PLATFORM_SNOWFLAKE_TOKEN_TYPE: ${{ secrets.CONTRACT_DATA_PLATFORM_SNOWFLAKE_TOKEN_TYPE }}
      DATA_PLATFORM_SNOWFLAKE_TIMEOUT: ${{ secrets.CONTRACT_DATA_PLATFORM_SNOWFLAKE_TIMEOUT }}
      LIVE_WAREHOUSE_SNOWFLAKE_ACCOUNT: ${{ secrets.CONTRACT_LIVE_WAREHOUSE_SNOWFLAKE_ACCOUNT }}
      LIVE_WAREHOUSE_SNOWFLAKE_DATABASE: ${{ secrets.CONTRACT_LIVE_WAREHOUSE_SNOWFLAKE_DATABASE }}
      LIVE_WAREHOUSE_SNOWFLAKE_SCHEMA: ${{ secrets.CONTRACT_LIVE_WAREHOUSE_SNOWFLAKE_SCHEMA }}
      LIVE_WAREHOUSE_SNOWFLAKE_WAREHOUSE: ${{ secrets.CONTRACT_LIVE_WAREHOUSE_SNOWFLAKE_WAREHOUSE }}
      LIVE_WAREHOUSE_SNOWFLAKE_ROLE: ${{ secrets.CONTRACT_LIVE_WAREHOUSE_SNOWFLAKE_ROLE }}

      DATA_PLATFORM_REDSHIFT_REGION: ${{ secrets.CONTRACT_DATA_PLATFORM_REDSHIFT_REGION }}
      DATA_PLATFORM_REDSHIFT_ENDPOINT: ${{ secrets.CONTRACT_DATA_PLATFORM_REDSHIFT_ENDPOINT }}
      DATA_PLATFORM_REDSHIFT_STS_ENDPOINT: ${{ secrets.CONTRACT_DATA_PLATFORM_REDSHIFT_STS_ENDPOINT }}
      DATA_PLATFORM_REDSHIFT_TIMEOUT: ${{ secrets.CONTRACT_DATA_PLATFORM_REDSHIFT_TIMEOUT }}
      LIVE_WAREHOUSE_REDSHIFT_CLUSTER: ${{ secrets.CONTRACT_LIVE_WAREHOUSE_REDSHIFT_CLUSTER }}
      LIVE_WAREHOUSE_REDSHIFT_DATABASE: ${{ secrets.CONTRACT_LIVE_WAREHOUSE_REDSHIFT_DATABASE }}
      LIVE_WAREHOUSE_REDSHIFT_SCHEMA: ${{ secrets.CONTRACT_LIVE_WAREHOUSE_REDSHIFT_SCHEMA }}
      LIVE_WAREHOUSE_REDSHIFT_DB_USER: ${{ secrets.CONTRACT_LIVE_WAREHOUSE_REDSHIFT_DB_USER }}
      LIVE_WAREHOUSE_REDSHIFT_SECRET_ARN: ${{ secrets.CONTRACT_LIVE_WAREHOUSE_REDSHIFT_SECRET_ARN }}

      DATA_PLATFORM_DATABRICKS_ENDPOINT: ${{ secrets.CONTRACT_DATA_PLATFORM_DATABRICKS_ENDPOINT }}
      DATA_PLATFORM_DATABRICKS_TOKEN: ${{ secrets.CONTRACT_DATA_PLATFORM_DATABRICKS_TOKEN }}
      DATA_PLATFORM_DATABRICKS_TIMEOUT: ${{ secrets.CONTRACT_DATA_PLATFORM_DATABRICKS_TIMEOUT }}
      LIVE_WAREHOUSE_DATABRICKS_WORKSPACE_URL: ${{ secrets.CONTRACT_LIVE_WAREHOUSE_DATABRICKS_WORKSPACE_URL }}
      LIVE_WAREHOUSE_DATABRICKS_WAREHOUSE_ID: ${{ secrets.CONTRACT_LIVE_WAREHOUSE_DATABRICKS_WAREHOUSE_ID }}
      LIVE_WAREHOUSE_DATABRICKS_CATALOG: ${{ secrets.CONTRACT_LIVE_WAREHOUSE_DATABRICKS_CATALOG }}
      LIVE_WAREHOUSE_DATABRICKS_SCHEMA: ${{ secrets.CONTRACT_LIVE_WAREHOUSE_DATABRICKS_SCHEMA }}

      AI_REMOTE_PROVIDER_ENDPOINT: ${{ secrets.CONTRACT_AI_REMOTE_PROVIDER_ENDPOINT }}
      AI_REMOTE_PROVIDER_TOKEN: ${{ secrets.CONTRACT_AI_REMOTE_PROVIDER_TOKEN }}
      AI_REMOTE_PROVIDER_MODEL: ${{ secrets.CONTRACT_AI_REMOTE_PROVIDER_MODEL }}
      AI_REMOTE_PROVIDER_SUPPORTED_CLASSIFICATIONS: ${{ secrets.CONTRACT_AI_REMOTE_PROVIDER_SUPPORTED_CLASSIFICATIONS }}
      AI_REMOTE_PROVIDER_TIMEOUT: ${{ secrets.CONTRACT_AI_REMOTE_PROVIDER_TIMEOUT }}
      AI_REMOTE_PROVIDER_RETRY_ATTEMPTS: ${{ secrets.CONTRACT_AI_REMOTE_PROVIDER_RETRY_ATTEMPTS }}
      AI_REMOTE_PROVIDER_RETRY_BACKOFF: ${{ secrets.CONTRACT_AI_REMOTE_PROVIDER_RETRY_BACKOFF }}
      AI_REMOTE_PROVIDER_MAX_REQUEST_BYTES: ${{ secrets.CONTRACT_AI_REMOTE_PROVIDER_MAX_REQUEST_BYTES }}
      AI_REMOTE_PROVIDER_MAX_RESPONSE_BYTES: ${{ secrets.CONTRACT_AI_REMOTE_PROVIDER_MAX_RESPONSE_BYTES }}
      AI_REMOTE_PROVIDER_MAX_OUTPUT_UNITS: ${{ secrets.CONTRACT_AI_REMOTE_PROVIDER_MAX_OUTPUT_UNITS }}
      AI_REMOTE_PROVIDER_INPUT_COST_CENTS_PER_1K_UNITS: ${{ secrets.CONTRACT_AI_REMOTE_PROVIDER_INPUT_COST_CENTS_PER_1K_UNITS }}
      AI_REMOTE_PROVIDER_OUTPUT_COST_CENTS_PER_1K_UNITS: ${{ secrets.CONTRACT_AI_REMOTE_PROVIDER_OUTPUT_COST_CENTS_PER_1K_UNITS }}
      LIVE_AI_CLASSIFICATION: ${{ secrets.CONTRACT_LIVE_AI_CLASSIFICATION }}

      REGION_AUTOMATION_ENDPOINT: ${{ secrets.CONTRACT_REGION_AUTOMATION_ENDPOINT }}
      REGION_AUTOMATION_SIGNING_SECRET: ${{ secrets.CONTRACT_REGION_AUTOMATION_SIGNING_SECRET }}
      REGION_AUTOMATION_BEARER_TOKEN: ${{ secrets.CONTRACT_REGION_AUTOMATION_BEARER_TOKEN }}
      REGION_AUTOMATION_TIMEOUT: ${{ secrets.CONTRACT_REGION_AUTOMATION_TIMEOUT }}
      REGION_AUTOMATION_RETRY_ATTEMPTS: ${{ secrets.CONTRACT_REGION_AUTOMATION_RETRY_ATTEMPTS }}
      REGION_AUTOMATION_RETRY_BACKOFF: ${{ secrets.CONTRACT_REGION_AUTOMATION_RETRY_BACKOFF }}
      REGION_AUTOMATION_MAX_RESPONSE_BYTES: ${{ secrets.CONTRACT_REGION_AUTOMATION_MAX_RESPONSE_BYTES }}
      LIVE_REGION_SOURCE_REGION: ${{ secrets.CONTRACT_LIVE_REGION_SOURCE_REGION }}
      LIVE_REGION_TARGET_REGION: ${{ secrets.CONTRACT_LIVE_REGION_TARGET_REGION }}
      LIVE_REGION_ALLOWED_REGIONS: ${{ secrets.CONTRACT_LIVE_REGION_ALLOWED_REGIONS }}
      LIVE_REGION_RPO_SECONDS: ${{ secrets.CONTRACT_LIVE_REGION_RPO_SECONDS }}
      LIVE_REGION_RTO_SECONDS: ${{ secrets.CONTRACT_LIVE_REGION_RTO_SECONDS }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Run hermetic provider failure injection
        id: failure_injection
        continue-on-error: true
        run: |
          : > provider-failure-injection.log
          set -o pipefail
          bash scripts/provider-failure-injection.sh 2>&1 | tee provider-failure-injection.log

      - name: Run live provider contract
        id: live_contract
        continue-on-error: true
        run: |
          : > live-provider-contract.log
          set -o pipefail
          bash scripts/live-provider-contracts.sh 2>&1 | tee live-provider-contract.log

      - name: Create provider validation evidence
        if: always()
        env:
          LIVE_CONTRACT_STATUS: ${{ steps.live_contract.outcome }}
          FAILURE_INJECTION_STATUS: ${{ steps.failure_injection.outcome }}
        run: |
          python3 scripts/provider-validation-evidence.py create \
            --output provider-validation-evidence.json \
            --target "$LIVE_PROVIDER_CONTRACT_TARGET" \
            --environment "$LIVE_PROVIDER_ENVIRONMENT" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-ref "$GITHUB_REF" \
            --live-status "$LIVE_CONTRACT_STATUS" \
            --failure-status "$FAILURE_INJECTION_STATUS" \
            --live-log live-provider-contract.log \
            --failure-log provider-failure-injection.log

      - name: Verify provider validation evidence
        if: always()
        run: |
          python3 scripts/provider-validation-evidence.py verify \
            --file provider-validation-evidence.json \
            --target "$LIVE_PROVIDER_CONTRACT_TARGET" \
            --environment "$LIVE_PROVIDER_ENVIRONMENT" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --require-passed

      - name: Upload provider validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-validation-${{ inputs.environment }}-${{ inputs.target }}-${{ github.run_id }}
          path: |
            live-provider-contract.log
            provider-failure-injection.log
            provider-validation-evidence.json
          if-no-files-found: warn
          retention-days: 30
