name: Terraform Delivery

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "scripts/terraform-*.py"
      - "scripts/terraform-prepare.sh"
      - ".github/workflows/terraform-delivery.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Terraform operation"
        required: true
        type: choice
        options:
          - plan
          - apply
          - drift
        default: plan
      provider:
        description: "Production cloud provider"
        required: true
        type: choice
        options:
          - aws
          - azure
          - gcp
      plan_run_id:
        description: "Successful manual plan workflow run ID required for apply"
        required: false
        type: string
      allow_destroy:
        description: "Allow plan artifacts that contain delete/replacement actions"
        required: false
        type: boolean
        default: false
      confirm_destroy:
        description: "Confirm applying a reviewed plan containing delete/replacement actions"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "30 19 * * *"

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: terraform-delivery-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TERRAFORM_VERSION: "1.16.1"

jobs:
  plan:
    name: Terraform Plan / Drift
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.operation != 'apply') &&
      (github.event_name == 'workflow_dispatch' || vars.TF_PROVIDER != '') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: terraform-plan
    env:
      SELECTED_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.provider || vars.TF_PROVIDER }}
      REQUESTED_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || (github.event_name == 'schedule' && 'drift' || 'plan') }}
      TF_BACKEND_CONFIG_B64: ${{ secrets.TF_BACKEND_CONFIG_B64 }}
      TF_VARS_B64: ${{ secrets.TF_VARS_B64 }}
      TF_PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.TF_AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.TF_AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.TF_AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Validate plan environment
        env:
          TF_PLAN_ENABLED: ${{ vars.TF_PLAN_ENABLED }}
        run: |
          test "$TF_PLAN_ENABLED" = "true" || {
            echo "::error::terraform-plan Environment must define TF_PLAN_ENABLED=true."
            exit 1
          }
          case "$SELECTED_PROVIDER" in
            aws|azure|gcp) ;;
            *)
              echo "::error::TF_PROVIDER/provider must be aws, azure, or gcp."
              exit 1
              ;;
          esac
          test -n "$TF_PLAN_ENCRYPTION_KEY" || {
            echo "::error::TF_PLAN_ENCRYPTION_KEY is required."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to AWS with OIDC
        if: env.SELECTED_PROVIDER == 'aws'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ vars.TF_AWS_REGION }}
          role-session-name: tf-plan-${{ github.run_id }}

      - name: Authenticate to Azure with OIDC
        if: env.SELECTED_PROVIDER == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.TF_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TF_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TF_AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to Google Cloud with OIDC
        if: env.SELECTED_PROVIDER == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.TF_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.TF_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.TF_GCP_PROJECT_ID }}

      - name: Materialize backend and variables
        run: bash scripts/terraform-prepare.sh

      - name: Initialize remote backend
        run: |
          TF_DIR="infra/terraform/$SELECTED_PROVIDER"
          terraform -chdir="$TF_DIR" init \
            -input=false \
            -backend-config=/tmp/backend.hcl

      - name: Create Terraform plan
        env:
          ALLOW_DESTROY: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_destroy || false }}
        run: |
          set +e
          TF_DIR="infra/terraform/$SELECTED_PROVIDER"
          terraform -chdir="$TF_DIR" plan \
            -input=false \
            -detailed-exitcode \
            -var-file=/tmp/terraform.tfvars \
            -out=/tmp/production.tfplan
          plan_exit=$?
          set -e

          if [ "$plan_exit" -eq 1 ]; then
            echo "::error::terraform plan failed."
            exit 1
          fi

          echo "PLAN_EXIT_CODE=$plan_exit" >> "$GITHUB_ENV"
          terraform -chdir="$TF_DIR" show -json /tmp/production.tfplan > /tmp/plan.json

          guard_args=()
          if [ "$ALLOW_DESTROY" = "true" ]; then
            guard_args+=(--allow-destroy)
          fi

          python3 scripts/terraform-plan-metadata.py \
            --plan-json /tmp/plan.json \
            --plan-bin /tmp/production.tfplan \
            --lock-file "$TF_DIR/.terraform.lock.hcl" \
            --provider "$SELECTED_PROVIDER" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --terraform-version "$TERRAFORM_VERSION" \
            --output /tmp/metadata.json \
            "${guard_args[@]}"

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("/tmp/metadata.json", "r", encoding="utf-8") as handle:
              metadata = json.load(handle)

          print("### Terraform plan")
          print()
          print(f"Provider: {metadata['provider']}")
          print(f"Commit: {metadata['commit']}")
          print(f"Actions: {json.dumps(metadata['counts'], sort_keys=True)}")
          print(f"Destructive changes: {metadata['destructive_change_count']}")
          PY

      - name: Encrypt reviewed plan bundle
        run: |
          mkdir -p /tmp/terraform-plan-content /tmp/terraform-plan-artifact
          cp /tmp/production.tfplan /tmp/terraform-plan-content/production.tfplan
          cp /tmp/metadata.json /tmp/terraform-plan-content/metadata.json
          cp "infra/terraform/$SELECTED_PROVIDER/.terraform.lock.hcl" \
            /tmp/terraform-plan-content/.terraform.lock.hcl

          tar -C /tmp/terraform-plan-content -czf /tmp/terraform-plan.tgz .
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in /tmp/terraform-plan.tgz \
            -out /tmp/terraform-plan-artifact/terraform-plan.tgz.enc \
            -pass env:TF_PLAN_ENCRYPTION_KEY

      - name: Upload encrypted plan artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-plan-${{ env.SELECTED_PROVIDER }}-${{ github.run_id }}
          path: /tmp/terraform-plan-artifact
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true

      - name: Fail drift check when changes exist
        if: env.REQUESTED_OPERATION == 'drift' && env.PLAN_EXIT_CODE == '2'
        run: |
          echo "::error::Terraform drift detected. Review this run's encrypted plan artifact."
          exit 1

  apply:
    name: Terraform Production Apply
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: terraform-production
    env:
      SELECTED_PROVIDER: ${{ inputs.provider }}
      TF_BACKEND_CONFIG_B64: ${{ secrets.TF_BACKEND_CONFIG_B64 }}
      TF_VARS_B64: ${{ secrets.TF_VARS_B64 }}
      TF_PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.TF_AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.TF_AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.TF_AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Restrict production apply
        env:
          TF_APPLY_ENABLED: ${{ vars.TF_APPLY_ENABLED }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Production Terraform apply must run from main."
            exit 1
          }
          test "$TF_APPLY_ENABLED" = "true" || {
            echo "::error::terraform-production Environment must define TF_APPLY_ENABLED=true."
            exit 1
          }
          printf '%s' "$PLAN_RUN_ID" | grep -Eq '^[0-9]+$' || {
            echo "::error::plan_run_id must be the numeric run ID of a successful manual plan on main."
            exit 1
          }
          test -n "$TF_PLAN_ENCRYPTION_KEY" || {
            echo "::error::TF_PLAN_ENCRYPTION_KEY is required."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to AWS with OIDC
        if: env.SELECTED_PROVIDER == 'aws'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ vars.TF_AWS_REGION }}
          role-session-name: tf-apply-${{ github.run_id }}

      - name: Authenticate to Azure with OIDC
        if: env.SELECTED_PROVIDER == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.TF_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TF_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TF_AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to Google Cloud with OIDC
        if: env.SELECTED_PROVIDER == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.TF_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.TF_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.TF_GCP_PROJECT_ID }}

      - name: Validate source plan workflow run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID" \
            > /tmp/source-run.json

          python3 - <<'PY'
          import json
          import os

          with open("/tmp/source-run.json", "r", encoding="utf-8") as handle:
              run = json.load(handle)

          expected = {
              "name": "Terraform Delivery",
              "event": "workflow_dispatch",
              "head_sha": os.environ["GITHUB_SHA"],
              "conclusion": "success",
          }

          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(
                      f"source plan run {key} mismatch: {run.get(key)!r} != {value!r}"
                  )
          PY

      - name: Download reviewed encrypted plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: terraform-plan-${{ inputs.provider }}-${{ inputs.plan_run_id }}
          path: /tmp/terraform-plan-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.plan_run_id }}

      - name: Decrypt and verify reviewed plan
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in /tmp/terraform-plan-artifact/terraform-plan.tgz.enc \
            -out /tmp/terraform-plan.tgz \
            -pass env:TF_PLAN_ENCRYPTION_KEY

          mkdir -p /tmp/terraform-plan-content
          tar -C /tmp/terraform-plan-content -xzf /tmp/terraform-plan.tgz

          test -f /tmp/terraform-plan-content/production.tfplan
          test -f /tmp/terraform-plan-content/metadata.json
          test -f /tmp/terraform-plan-content/.terraform.lock.hcl

          verify_args=()
          if [ "$CONFIRM_DESTROY" = "true" ]; then
            verify_args+=(--confirm-destroy)
          fi

          python3 scripts/terraform-verify-plan.py \
            --metadata /tmp/terraform-plan-content/metadata.json \
            --plan-bin /tmp/terraform-plan-content/production.tfplan \
            --lock-file /tmp/terraform-plan-content/.terraform.lock.hcl \
            --expected-provider "$SELECTED_PROVIDER" \
            --expected-commit "$GITHUB_SHA" \
            --expected-run-id "$PLAN_RUN_ID" \
            "${verify_args[@]}"

      - name: Materialize backend and variables
        run: bash scripts/terraform-prepare.sh

      - name: Initialize exact provider lock
        run: |
          TF_DIR="infra/terraform/$SELECTED_PROVIDER"
          cp /tmp/terraform-plan-content/.terraform.lock.hcl "$TF_DIR/.terraform.lock.hcl"
          terraform -chdir="$TF_DIR" init \
            -input=false \
            -lockfile=readonly \
            -backend-config=/tmp/backend.hcl

      - name: Apply reviewed plan
        run: |
          TF_DIR="infra/terraform/$SELECTED_PROVIDER"
          terraform -chdir="$TF_DIR" apply \
            -input=false \
            /tmp/terraform-plan-content/production.tfplan

      - name: Record apply summary
        run: |
          {
            echo "### Terraform production apply complete"
            echo
            echo "Provider: $SELECTED_PROVIDER"
            echo "Commit: $GITHUB_SHA"
            echo "Reviewed plan run: ${{ inputs.plan_run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
