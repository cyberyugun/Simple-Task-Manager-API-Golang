name: Performance

on:
  schedule:
    - cron: "0 19 * * 6"
  workflow_dispatch:
    inputs:
      profile:
        description: "Performance profile"
        required: true
        type: choice
        options:
          - load
          - spike
          - soak
        default: load

permissions:
  contents: read

jobs:
  k6:
    name: k6 ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'load' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PERF_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'load' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start stack
        env:
          JWT_SECRET: performance-secret-123456789012345678901234
          AUTH_RATE_LIMIT_REQUESTS: "10000"
          DB_MAX_OPEN_CONNS: "20"
          DB_MAX_IDLE_CONNS: "10"
          REDIS_POOL_SIZE: "40"
          REDIS_MIN_IDLE_CONNS: "10"
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:8080/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Run k6 profile
        run: |
          docker run --rm --network host             -v "$PWD:/work"             -w /work             grafana/k6:2.3.0 run             -e BASE_URL=http://127.0.0.1:8080             -e PROFILE="$PERF_PROFILE"             -e RUN_ID="$GITHUB_RUN_ID"             tests/performance/task-api.js

      - name: Capture service metrics
        if: always()
        run: |
          curl --silent http://localhost:8080/metrics > performance-metrics.txt || true
          docker compose ps > performance-containers.txt || true

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-${{ env.PERF_PROFILE }}-${{ github.run_id }}
          path: |
            performance-summary.json
            performance-metrics.txt
            performance-containers.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Stop stack
        if: always()
        run: docker compose down -v
