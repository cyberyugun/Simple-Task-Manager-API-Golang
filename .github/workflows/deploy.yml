name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/cyberyugun/simple-task-manager-api-golang
  KUBE_NAMESPACE: task-manager

jobs:
  build:
    name: Build, Scan, Sign and Attest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Restrict production refs
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *)
              echo "::error::Production deployment is allowed only from main or version tags."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: build_meta
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.push.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.push.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless sign image
        run: cosign sign --yes "$IMAGE_REPOSITORY@${{ steps.push.outputs.digest }}"

      - name: Verify image signature
        run: |
          cosign verify "$IMAGE_REPOSITORY@${{ steps.push.outputs.digest }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/.github/workflows/deploy.yml@refs/(heads/main|tags/v.*)$"

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    environment: production
    env:
      IMAGE_DIGEST: ${{ needs.build.outputs.image-digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify signed release before deployment
        run: |
          test -n "$IMAGE_DIGEST"
          cosign verify "$IMAGE_REPOSITORY@$IMAGE_DIGEST" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/.github/workflows/deploy.yml@refs/(heads/main|tags/v.*)$"

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Configure cluster access
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "::error::Production environment secret KUBE_CONFIG_B64 is required."
            echo "::notice::For managed Kubernetes, replace this step with the provider's GitHub OIDC login action to remove long-lived kubeconfig credentials."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Prepare namespace and configuration
        run: |
          kubectl apply -f deploy/k8s/base/namespace.yaml
          kubectl apply -f deploy/k8s/base/configmap.yaml
          kubectl -n "$KUBE_NAMESPACE" get secret task-api-secrets >/dev/null
          if ! kubectl -n "$KUBE_NAMESPACE" get secret ghcr-pull-secret >/dev/null 2>&1; then
            echo "::warning::ghcr-pull-secret is missing. This is okay only when the GHCR package is public."
          fi

      - name: Run database migration from signed digest
        run: |
          kubectl -n "$KUBE_NAMESPACE" delete job task-api-migrate --ignore-not-found --wait=true
          sed "s|image: task-api:latest|image: $IMAGE_REPOSITORY@$IMAGE_DIGEST|" \
            deploy/k8s/base/migration-job.yaml | kubectl apply -f -

          if ! kubectl -n "$KUBE_NAMESPACE" wait \
            --for=condition=complete job/task-api-migrate \
            --timeout=5m; then
            kubectl -n "$KUBE_NAMESPACE" logs job/task-api-migrate --all-containers=true || true
            exit 1
          fi

      - name: Deploy application by immutable digest
        env:
          INGRESS_HOST: ${{ vars.KUBE_INGRESS_HOST }}
        run: |
          if [ -z "$INGRESS_HOST" ]; then
            echo "::error::Production environment variable KUBE_INGRESS_HOST is required."
            exit 1
          fi

          sed -i "s/task-api.example.com/$INGRESS_HOST/g" \
            deploy/k8s/overlays/production/ingress.yaml
          sed -i "s/newTag: latest/digest: $IMAGE_DIGEST/" \
            deploy/k8s/overlays/production/kustomization.yaml

          kubectl apply -k deploy/k8s/overlays/production
          kubectl -n "$KUBE_NAMESPACE" rollout status deployment/task-api --timeout=5m

      - name: Verify deployed version
        run: |
          kubectl -n "$KUBE_NAMESPACE" port-forward service/task-api 18080:80 >/tmp/task-api-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/version >/tmp/version.json; then
              break
            fi
            sleep 1
          done

          cat /tmp/version.json
          python3 - <<'PY'
          import json
          import os

          with open("/tmp/version.json", "r", encoding="utf-8") as file:
              payload = json.load(file)

          actual = payload["data"]["commit"]
          expected = os.environ["GITHUB_SHA"]
          if actual != expected:
              raise SystemExit(f"deployed commit {actual!r} does not match {expected!r}")
          PY

      - name: Show rollout
        run: |
          kubectl -n "$KUBE_NAMESPACE" get deployment,service,ingress,hpa,pdb
          kubectl -n "$KUBE_NAMESPACE" get pods -l app.kubernetes.io/name=task-api -o wide
