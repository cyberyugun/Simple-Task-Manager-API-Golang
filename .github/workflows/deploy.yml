name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/cyberyugun/simple-task-manager-api-golang
  KUBE_NAMESPACE: task-manager

jobs:
  build:
    name: Build, Scan, Sign and Attest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Restrict production refs
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *)
              echo "::error::Production deployment is allowed only from main or version tags."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: build_meta
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.push.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.push.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless sign image
        run: cosign sign --yes "$IMAGE_REPOSITORY@${{ steps.push.outputs.digest }}"

      - name: Verify image signature
        run: |
          cosign verify "$IMAGE_REPOSITORY@${{ steps.push.outputs.digest }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/.github/workflows/deploy.yml@refs/(heads/main|tags/v.*)$"

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    environment: production
    env:
      IMAGE_DIGEST: ${{ needs.build.outputs.image-digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify signed release before deployment
        run: |
          test -n "$IMAGE_DIGEST"
          cosign verify "$IMAGE_REPOSITORY@$IMAGE_DIGEST" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/.github/workflows/deploy.yml@refs/(heads/main|tags/v.*)$"

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: Validate cluster authentication mode
        env:
          KUBE_AUTH_MODE: ${{ vars.KUBE_AUTH_MODE }}
        run: |
          case "${KUBE_AUTH_MODE:-kubeconfig}" in
            aws-eks|azure-aks|gke|kubeconfig) ;;
            *)
              echo "::error::KUBE_AUTH_MODE must be one of: aws-eks, azure-aks, gke, kubeconfig."
              exit 1
              ;;
          esac

      - name: Authenticate to AWS with GitHub OIDC
        if: vars.KUBE_AUTH_MODE == 'aws-eks'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: Configure EKS cluster
        if: vars.KUBE_AUTH_MODE == 'aws-eks'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
        run: |
          test -n "$AWS_REGION" || { echo "::error::AWS_REGION is required."; exit 1; }
          test -n "$EKS_CLUSTER_NAME" || { echo "::error::EKS_CLUSTER_NAME is required."; exit 1; }
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Authenticate to Azure with GitHub OIDC
        if: vars.KUBE_AUTH_MODE == 'azure-aks'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure AKS cluster
        if: vars.KUBE_AUTH_MODE == 'azure-aks'
        uses: azure/aks-set-context@c7eb093e5a5d47caa333f64974d5fd1cd4bf069d # v4.0.3
        with:
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
          admin: false

      - name: Authenticate to Google Cloud with GitHub OIDC
        if: vars.KUBE_AUTH_MODE == 'gke'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure GKE cluster
        if: vars.KUBE_AUTH_MODE == 'gke'
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure cluster access from kubeconfig fallback
        if: vars.KUBE_AUTH_MODE == '' || vars.KUBE_AUTH_MODE == 'kubeconfig'
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "::error::KUBE_CONFIG_B64 is required when KUBE_AUTH_MODE is kubeconfig."
            exit 1
          fi
          echo "::warning::Using long-lived kubeconfig fallback. Prefer aws-eks, azure-aks, or gke OIDC mode for production."
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify cluster access
        run: kubectl cluster-info

      - name: Prepare namespace
        run: kubectl apply -f deploy/k8s/base/namespace.yaml

      - name: Production readiness preflight
        env:
          REQUIRE_GHCR_PULL_SECRET: ${{ vars.REQUIRE_GHCR_PULL_SECRET }}
          REQUIRE_METRICS_SERVER: ${{ vars.REQUIRE_METRICS_SERVER }}
          REQUIRE_OBSERVABILITY: ${{ vars.REQUIRE_OBSERVABILITY }}
        run: bash scripts/production-preflight.sh

      - name: Apply runtime configuration
        run: kubectl apply -f deploy/k8s/base/configmap.yaml

      - name: Run database migration from signed digest
        run: |
          kubectl -n "$KUBE_NAMESPACE" delete job task-api-migrate --ignore-not-found --wait=true
          sed "s|image: task-api:latest|image: $IMAGE_REPOSITORY@$IMAGE_DIGEST|" \
            deploy/k8s/base/migration-job.yaml | kubectl apply -f -

          if ! kubectl -n "$KUBE_NAMESPACE" wait \
            --for=condition=complete job/task-api-migrate \
            --timeout=5m; then
            kubectl -n "$KUBE_NAMESPACE" logs job/task-api-migrate --all-containers=true || true
            exit 1
          fi

      - name: Deploy application by immutable digest
        env:
          INGRESS_HOST: ${{ vars.KUBE_INGRESS_HOST }}
          CERT_MANAGER_EMAIL: ${{ vars.CERT_MANAGER_EMAIL }}
        run: |
          if [ -z "$INGRESS_HOST" ]; then
            echo "::error::Production environment variable KUBE_INGRESS_HOST is required."
            exit 1
          fi
          if [ -z "$CERT_MANAGER_EMAIL" ]; then
            echo "::error::Production environment variable CERT_MANAGER_EMAIL is required."
            exit 1
          fi

          sed -i "s/task-api.example.com/$INGRESS_HOST/g" \
            deploy/k8s/overlays/production/ingress.yaml
          sed -i "s/platform@example.com/$CERT_MANAGER_EMAIL/g" \
            deploy/k8s/overlays/production/clusterissuer.yaml
          sed -i "s/newTag: latest/digest: $IMAGE_DIGEST/" \
            deploy/k8s/overlays/production/kustomization.yaml

          kubectl apply -k deploy/k8s/overlays/production
          kubectl -n "$KUBE_NAMESPACE" rollout status deployment/task-api --timeout=5m

      - name: Verify deployed version
        run: |
          kubectl -n "$KUBE_NAMESPACE" port-forward service/task-api 18080:80 >/tmp/task-api-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/version >/tmp/version.json; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:18080/health >/tmp/health.json
          curl --fail --silent http://127.0.0.1:18080/ready >/tmp/ready.json
          curl --fail --silent http://127.0.0.1:18080/metrics >/tmp/metrics.txt
          grep -q 'task_api_http_request_duration_seconds_bucket' /tmp/metrics.txt
          grep -q 'task_api_trace_export_errors_total' /tmp/metrics.txt

          cat /tmp/version.json
          python3 - <<'PY'
          import json
          import os

          with open("/tmp/version.json", "r", encoding="utf-8") as file:
              payload = json.load(file)

          actual = payload["data"]["commit"]
          expected = os.environ["GITHUB_SHA"]
          if actual != expected:
              raise SystemExit(f"deployed commit {actual!r} does not match {expected!r}")
          PY

      - name: Verify observability resources
        run: |
          kubectl -n "$KUBE_NAMESPACE" get servicemonitor task-api
          kubectl -n "$KUBE_NAMESPACE" get prometheusrule task-api-slo
          kubectl -n monitoring get configmap task-api-grafana-dashboard

      - name: Show rollout
        run: |
          kubectl -n "$KUBE_NAMESPACE" get deployment,service,ingress,hpa,pdb
          kubectl -n "$KUBE_NAMESPACE" get pods -l app.kubernetes.io/name=task-api -o wide
