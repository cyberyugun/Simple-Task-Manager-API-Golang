name: Phase 34 Go Format
on:
  pull_request:
permissions:
  contents: write
jobs:
  gofmt:
    if: github.head_ref == 'phase-34-enterprise-workflow-builder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-34-enterprise-workflow-builder
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Format and push
        run: |
          gofmt -w cmd/api/main.go cmd/worker/main.go internal/model/workflow.go internal/repository/workflow_repository.go internal/repository/postgres_workflow_repository.go internal/repository/workflow_postgres_integration_test.go internal/service/workflow_executor.go internal/service/workflow_service.go internal/service/workflow_engine.go internal/service/workflow_service_test.go internal/handler/workflow_handler.go
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/api/main.go cmd/worker/main.go internal/model/workflow.go internal/repository/workflow_repository.go internal/repository/postgres_workflow_repository.go internal/repository/workflow_postgres_integration_test.go internal/service/workflow_executor.go internal/service/workflow_service.go internal/service/workflow_engine.go internal/service/workflow_service_test.go internal/handler/workflow_handler.go
          git commit -m "style(phase-34): gofmt workflow implementation"
          git push origin HEAD:phase-34-enterprise-workflow-builder
