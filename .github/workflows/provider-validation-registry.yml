name: Provider Validation Registry

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: Optional comma/space-separated Live Provider Contracts run IDs; empty scans recent provider-validation artifacts
        required: false
        default: ""
        type: string
      max_artifacts:
        description: Maximum recent provider-validation artifacts to scan when run_ids is empty
        required: true
        default: "200"
        type: string
      max_age_days:
        description: Passed evidence becomes expired after this many days
        required: true
        default: "30"
        type: string
      environments:
        description: Environments included in the registry
        required: true
        default: all
        type: choice
        options:
          - all
          - production
          - staging
          - development
      expected_commit:
        description: Optional expected tested commit; empty uses this workflow commit
        required: false
        default: ""
        type: string
      require_all_passed:
        description: Fail unless every selected target/environment cell is passed
        required: true
        default: false
        type: boolean
      require_current_commit:
        description: Fail when passed evidence does not match the expected commit
        required: true
        default: false
        type: boolean
      required_targets:
        description: Optional comma/space-separated provider targets evaluated by the policy gate
        required: false
        default: ""
        type: string
      policy_environment:
        description: Environment evaluated by the policy gate
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
          - development
      policy_mode:
        description: Policy behavior for required targets
        required: true
        default: off
        type: choice
        options:
          - off
          - warn
          - enforce
      policy_require_current_commit:
        description: Require policy targets to match the expected commit
        required: true
        default: false
        type: boolean
      policy_require_operational_evidence:
        description: Require external operational evidence for every policy target
        required: true
        default: false
        type: boolean
      policy_require_operational_approval:
        description: Require dual-controlled approval for operational evidence
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  registry:
    name: Build provider validation registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_RUN_IDS: ${{ inputs.run_ids }}
      MAX_ARTIFACTS: ${{ inputs.max_artifacts }}
      MAX_AGE_DAYS: ${{ inputs.max_age_days }}
      REGISTRY_ENVIRONMENTS: ${{ inputs.environments }}
      EXPECTED_COMMIT_INPUT: ${{ inputs.expected_commit }}
      REQUIRE_ALL_PASSED: ${{ inputs.require_all_passed }}
      REQUIRE_CURRENT_COMMIT: ${{ inputs.require_current_commit }}
      POLICY_REQUIRED_TARGETS: ${{ inputs.required_targets }}
      POLICY_ENVIRONMENT: ${{ inputs.policy_environment }}
      POLICY_MODE: ${{ inputs.policy_mode }}
      POLICY_REQUIRE_CURRENT_COMMIT: ${{ inputs.policy_require_current_commit }}
      POLICY_REQUIRE_OPERATIONAL_EVIDENCE: ${{ inputs.policy_require_operational_evidence }}
      POLICY_REQUIRE_OPERATIONAL_APPROVAL: ${{ inputs.policy_require_operational_approval }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate registry inputs
        run: |
          set -euo pipefail
          printf '%s' "$MAX_ARTIFACTS" | grep -Eq '^[1-9][0-9]{0,3}$'
          printf '%s' "$MAX_AGE_DAYS" | grep -Eq '^[1-9][0-9]{0,3}$'
          if (( MAX_ARTIFACTS > 1000 )); then
            echo "::error::max_artifacts must be <= 1000"
            exit 1
          fi
          if (( MAX_AGE_DAYS > 3650 )); then
            echo "::error::max_age_days must be <= 3650"
            exit 1
          fi

      - name: Discover and download provider evidence artifacts
        run: |
          set -euo pipefail
          mkdir -p provider-evidence
          : > /tmp/provider-artifacts.tsv

          compact_run_ids="$(printf '%s' "$EVIDENCE_RUN_IDS" | tr -d '[:space:],')"
          if [[ -n "$compact_run_ids" ]]; then
            normalized="$(printf '%s' "$EVIDENCE_RUN_IDS" | tr ',' ' ')"
            for run_id in $normalized; do
              if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
                echo "::error::invalid workflow run id: $run_id"
                exit 1
              fi
              gh api --paginate                 "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100"                 --jq '.artifacts[] | select(.expired == false and (.name | startswith("provider-validation-")) and ((.name | startswith("provider-validation-registry-")) | not)) | [.workflow_run.id, .name] | @tsv'                 >> /tmp/provider-artifacts.tsv
            done
          else
            gh api --paginate               "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100"               --jq '.artifacts[] | select(.expired == false and (.name | startswith("provider-validation-")) and ((.name | startswith("provider-validation-registry-")) | not)) | [.workflow_run.id, .name] | @tsv'               > /tmp/provider-artifacts-all.tsv
            awk '!seen[$0]++' /tmp/provider-artifacts-all.tsv > /tmp/provider-artifacts-unique.tsv
            head -n "$MAX_ARTIFACTS" /tmp/provider-artifacts-unique.tsv > /tmp/provider-artifacts.tsv
          fi

          sort -u /tmp/provider-artifacts.tsv -o /tmp/provider-artifacts.tsv
          artifact_count="$(wc -l < /tmp/provider-artifacts.tsv | tr -d ' ')"
          echo "Discovered provider evidence artifacts: $artifact_count"

          while IFS=$'	' read -r run_id artifact_name; do
            [[ -n "$run_id" && -n "$artifact_name" ]] || continue
            safe_name="$(printf '%s' "$artifact_name" | tr -c 'A-Za-z0-9._-' '_')"
            destination="provider-evidence/${run_id}-${safe_name}"
            mkdir -p "$destination"
            gh run download "$run_id"               --repo "$GITHUB_REPOSITORY"               --name "$artifact_name"               --dir "$destination"
          done < /tmp/provider-artifacts.tsv

      - name: Discover operational evidence artifacts
        if: env.POLICY_MODE != 'off' && env.POLICY_REQUIRE_OPERATIONAL_EVIDENCE == 'true'
        run: |
          set -euo pipefail
          mkdir -p provider-operational-evidence
          gh api --paginate \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and (((.name | startswith("provider-operational-evidence-"))) or ((.name | startswith("provider-operational-approved-"))) or ((.name | startswith("provider-operational-revocation-"))))) | [.workflow_run.id, .name] | @tsv' \
            > /tmp/provider-operational-artifacts-all.tsv
          awk '!seen[$0]++' /tmp/provider-operational-artifacts-all.tsv > /tmp/provider-operational-artifacts-unique.tsv
          head -n "$MAX_ARTIFACTS" /tmp/provider-operational-artifacts-unique.tsv > /tmp/provider-operational-artifacts.tsv

          while IFS=$'\t' read -r run_id artifact_name; do
            [[ -n "$run_id" && -n "$artifact_name" ]] || continue
            safe_name="$(printf '%s' "$artifact_name" | tr -c 'A-Za-z0-9._-' '_')"
            destination="provider-operational-evidence/${run_id}-${safe_name}"
            mkdir -p "$destination"
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$artifact_name" \
              --dir "$destination"
          done < /tmp/provider-operational-artifacts.tsv

      - name: Build validation registry
        run: |
          set -euo pipefail
          expected_commit="$EXPECTED_COMMIT_INPUT"
          if [[ -z "$expected_commit" ]]; then
            expected_commit="$GITHUB_SHA"
          fi
          case "$REGISTRY_ENVIRONMENTS" in
            all) environments="development,staging,production" ;;
            development|staging|production) environments="$REGISTRY_ENVIRONMENTS" ;;
            *)
              echo "::error::unsupported environments selection: $REGISTRY_ENVIRONMENTS"
              exit 1
              ;;
          esac

          python3 scripts/provider-validation-registry.py build             --input-dir provider-evidence             --output-json provider-validation-registry.json             --output-markdown provider-validation-registry.md             --max-age-days "$MAX_AGE_DAYS"             --expected-commit "$expected_commit"             --environments "$environments"

          {
            echo "EXPECTED_COMMIT_RESOLVED=$expected_commit"
            echo "REGISTRY_ENVIRONMENTS_RESOLVED=$environments"
          } >> "$GITHUB_ENV"

          cat provider-validation-registry.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify validation registry
        run: |
          set -euo pipefail
          args=(
            verify
            --file provider-validation-registry.json
            --expected-commit "$EXPECTED_COMMIT_RESOLVED"
          )
          if [[ "$REQUIRE_ALL_PASSED" == "true" ]]; then
            args+=(--require-all-passed)
          fi
          if [[ "$REQUIRE_CURRENT_COMMIT" == "true" ]]; then
            args+=(--require-current-commit)
          fi
          python3 scripts/provider-validation-registry.py "${args[@]}"

      - name: Evaluate required-provider policy
        if: env.POLICY_MODE != 'off'
        run: |
          set -euo pipefail
          if [[ -z "${POLICY_REQUIRED_TARGETS//[[:space:],]/}" ]]; then
            echo "::error::required_targets must contain at least one target when policy_mode is warn or enforce."
            exit 1
          fi

          policy_args=(
            evaluate
            --registry provider-validation-registry.json
            --environment "$POLICY_ENVIRONMENT"
            --required-targets "$POLICY_REQUIRED_TARGETS"
            --expected-commit "$EXPECTED_COMMIT_RESOLVED"
            --mode "$POLICY_MODE"
            --output-json provider-validation-policy.json
            --output-markdown provider-validation-policy.md
          )
          if [[ "$POLICY_REQUIRE_CURRENT_COMMIT" == "true" ]]; then
            policy_args+=(--require-current-commit)
          fi
          if [[ "$POLICY_REQUIRE_OPERATIONAL_EVIDENCE" == "true" ]]; then
            policy_args+=(
              --operational-evidence-dir provider-operational-evidence
              --require-operational-evidence
            )
          fi
          if [[ "$POLICY_REQUIRE_OPERATIONAL_APPROVAL" == "true" ]]; then
            policy_args+=(--require-operational-approval)
          fi
          python3 scripts/provider-validation-policy.py "${policy_args[@]}"

          verify_args=(
            verify
            --file provider-validation-policy.json
            --environment "$POLICY_ENVIRONMENT"
            --required-targets "$POLICY_REQUIRED_TARGETS"
            --expected-commit "$EXPECTED_COMMIT_RESOLVED"
          )
          if [[ "$POLICY_MODE" == "enforce" ]]; then
            verify_args+=(--require-passed)
          fi
          if [[ "$POLICY_REQUIRE_OPERATIONAL_EVIDENCE" == "true" ]]; then
            verify_args+=(--require-operational-evidence)
          fi
          if [[ "$POLICY_REQUIRE_OPERATIONAL_APPROVAL" == "true" ]]; then
            verify_args+=(--require-operational-approval)
          fi
          python3 scripts/provider-validation-policy.py "${verify_args[@]}"
          cat provider-validation-policy.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload registry evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-validation-registry-${{ github.run_id }}
          path: |
            provider-validation-registry.json
            provider-validation-registry.md
            provider-validation-policy.json
            provider-validation-policy.md
          if-no-files-found: warn
          retention-days: 30
