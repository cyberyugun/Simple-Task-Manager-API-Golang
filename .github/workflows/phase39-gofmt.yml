name: Phase 39 Gofmt

on:
  push:
    branches:
      - phase-39-enterprise-event-fabric-schema-registry

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-39-enterprise-event-fabric-schema-registry
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Format
        run: gofmt -w cmd/api/main.go cmd/worker/main.go internal/model/event.go internal/model/event_fabric.go internal/repository/event_repository.go internal/repository/event_fabric_repository.go internal/repository/postgres_event_fabric_repository.go internal/repository/event_fabric_postgres_integration_test.go internal/service/event_fabric_service.go internal/service/event_fabric_service_test.go internal/handler/event_fabric_handler.go
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(phase-39): gofmt event fabric"
          git push origin HEAD:phase-39-enterprise-event-fabric-schema-registry
