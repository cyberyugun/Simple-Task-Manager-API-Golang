name: Phase 38 Gofmt

on:
  push:
    branches:
      - phase-38-connector-oauth-secret-governance

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-38-connector-oauth-secret-governance
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Format
        run: gofmt -w cmd/worker/main.go internal/model/connector_security.go internal/repository/connector_security_repository.go internal/repository/postgres_connector_security_repository.go internal/service/connector_security_service.go internal/service/connector_security_service_test.go internal/repository/connector_security_postgres_integration_test.go internal/handler/connector_security_handler.go internal/service/integration_service.go cmd/api/main.go
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(phase-38): gofmt connector security"
          git push origin HEAD:phase-38-connector-oauth-secret-governance
